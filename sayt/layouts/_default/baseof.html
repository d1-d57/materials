<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e6e5e1;
    --ink:#23282b;
    --muted:#6b757a;
    --accent:#a7c2cb;
    --line:#cfd6d4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{
    font-family:'Glacial Indifference','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:72px 28px 96px}
  header{margin-bottom:44px}
  h1{
    font-family:'Forum',serif;
    font-weight:400;
    font-size:clamp(40px,7vw,64px);
    line-height:1.04;
    margin:0 0 12px;
    letter-spacing:.01em;
  }
  .sub{color:var(--muted);font-size:clamp(16px,2.4vw,18px);max-width:46ch}
  .list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  a.item{
    display:block;
    text-decoration:none;color:inherit;
    padding:20px 6px;
    border-bottom:1px solid var(--line);
    transition:padding-left .18s ease,background .18s ease;
  }
  a.item:hover{padding-left:16px;background:rgba(167,194,203,.16)}
  .ttl{
    font-family:'Forum',serif;
    font-size:clamp(22px,3.4vw,28px);
    line-height:1.14;
    display:block;margin:0 0 3px;
  }
  .desc{color:var(--muted);font-size:15px;display:block}
  footer{margin-top:52px;color:var(--muted);font-size:13px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
{{ block "main" . }}{{ end }}
  <footer>
    Математические материалы · <a href="https://github.com/d1-d57/materials">github.com/d1-d57/materials</a>
  </footer>
</div>
</body>
</html>
