<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{PHOTOS}}
<style>
{{STYLE}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="top"><span>{{TOP_LEFT}}</span><span>{{TOP_RIGHT}}</span></div>
    <h1>{{H1}}<span class="sub">{{SUB}}</span></h1>
    <p class="lede">{{LEDE}}</p>
    <div class="taglegend">
      <span class="h3tag t-hook">Крючок</span>
      <span class="h3tag t-story">Рассказ</span>
      <span class="h3tag t-math">Математика · руками</span>
      <span class="h3tag t-tech">Техблок</span>
      <span class="h3tag t-box">Чёрный ящик</span>
      <span class="h3tag t-hw">Домашка</span>
    </div>
  </div>
</header>

<main>
<section id="{{SECTION_ID}}"><div class="wrap"><div class="col">
{{BODY}}
</div></div></section>
</main>

<footer class="src"><div class="wrap"><div class="col">
  <p>{{FOOTER}}</p>
</div></div></footer>

</body>
</html>
