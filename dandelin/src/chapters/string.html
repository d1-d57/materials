<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#fff;overflow:hidden}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  svg{width:100%;height:100%;display:block}
</style></head>
<body>
<div id="wrap">
<svg id="svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
  <!-- вертикальная полоска-сумма слева: голубой (PF1) снизу + красный (PF2) сверху, высота = 2a -->
  <rect id="seg1" x="60" width="26" fill="#5b8fc9"/>   <!-- |PF1| -->
  <rect id="seg2" x="60" width="26" fill="#c0492f"/>   <!-- |PF2| -->
  <!-- эллипс -->
  <ellipse cx="350" cy="300" rx="205" ry="150" fill="#a7c2cb" fill-opacity="0.09" stroke="#333" stroke-width="1.8"/>
  <!-- отрезки PF1 (голубой) и PF2 (красный) -->
  <line id="r1" stroke="#5b8fc9" stroke-width="3" stroke-linecap="round"/>
  <line id="r2" stroke="#c0492f" stroke-width="3" stroke-linecap="round"/>
  <!-- фокусы (без подписей) -->
  <circle id="F1" r="4" fill="#333"/><circle id="F2" r="4" fill="#333"/>
  <!-- точка P -->
  <circle id="P" r="5.5" fill="#785a18" stroke="#fff" stroke-width="2"/>
</svg>
</div>
<script>{{DRIVER:05}}<\/script>
</body></html>
