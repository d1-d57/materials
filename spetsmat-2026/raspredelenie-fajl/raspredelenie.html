<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Распределение — спецмат, 9 класс</title>
<style>
:root{
  --bg:#fbfaf6; --panel:#fffdf8; --text:#211f1b; --muted:#6d675c;
  --rule:#e4dfd2; --accent:#2f6e8e; --accent-soft:#e8f0f4;
  --krasn:#b3402a; --krasn-fon:rgba(179,64,42,.08);
  --gV:#2f6e8e; --gV-fon:#e3eef4;
  --gD:#7a4a9c; --gD-fon:#efe6f6;
  --gN:#2d7a53; --gN-fon:#e2f1e8;
  --faint:#a8a08d;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1e22; --panel:#23272c; --text:#dcd8d0; --muted:#9a948a;
  --rule:#343a41; --accent:#7fb6d2; --accent-soft:#22333d;
  --krasn:#e8836a; --krasn-fon:rgba(232,131,106,.12);
  --gV:#7fb6d2; --gV-fon:#22333d;
  --gD:#bd9ada; --gD-fon:#2f2739;
  --gN:#7cc79b; --gN-fon:#1f3529;
  --faint:#6b6f75;
}}
:root[data-theme="dark"]{
  --bg:#1b1e22; --panel:#23272c; --text:#dcd8d0; --muted:#9a948a;
  --rule:#343a41; --accent:#7fb6d2; --accent-soft:#22333d;
  --krasn:#e8836a; --krasn-fon:rgba(232,131,106,.12);
  --gV:#7fb6d2; --gV-fon:#22333d; --gD:#bd9ada; --gD-fon:#2f2739;
  --gN:#7cc79b; --gN-fon:#1f3529; --faint:#6b6f75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:19px;line-height:1.4;padding:1.4rem 2rem 3rem}

.verh{display:flex;align-items:baseline;gap:1.1rem;flex-wrap:wrap;margin:0 0 1rem}
h1{font-size:1.85rem;font-weight:600;margin:0;letter-spacing:-.015em}
.pod{color:var(--muted);font-size:1rem}
button{font:inherit;padding:.45em 1.1em;border-radius:9px;cursor:pointer;
  border:1px solid var(--rule);background:var(--panel);color:var(--text)}
#skachat{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff;
  font-weight:600}
#skachat:hover{opacity:.88}
#sbros{font-size:.88rem;color:var(--muted);padding:.35em .8em}

/* ── пять вкладок ─────────────────────────────────────── */
.tabbar{display:flex;gap:.3rem;border-bottom:2px solid var(--rule);margin:0 0 1.5rem;
  flex-wrap:wrap}
.tabbar button{border:2px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;
  margin-bottom:-2px;font-weight:600;font-size:1.1rem;color:var(--muted);background:none;
  padding:.5em 1.25em}
.tabbar button.on{color:var(--accent);background:var(--panel);
  border-color:var(--rule) var(--rule) var(--panel)}

/* ── шапка группы: группа и кабинет ОДИН раз ──────────── */
.shapka{display:flex;gap:2rem;align-items:baseline;flex-wrap:wrap;
  padding:.75rem 1.2rem;border:1px solid var(--rule);border-radius:10px;
  background:var(--panel);margin:0 0 1.3rem}
.shapka .kod{font-size:1.5rem;font-weight:700}
.shapka .pole{color:var(--muted);font-size:1rem}
.shapka .pole b{color:var(--text);font-weight:600;font-size:1.1rem}
.shapka .schet{margin-left:auto;font-size:1.05rem}
.shapka .zhdut{color:var(--krasn)}
.shapka input{width:6rem;padding:.28em .5em;font:inherit;font-size:1.15rem;font-weight:600;
  text-align:center;border:1px solid var(--rule);border-radius:7px;background:var(--bg);
  color:var(--text)}
.shapka input:focus{outline:none;border-color:var(--accent)}

/* ── строка школьника: имя НИКОГДА не переносится на вторую строку ──
   Перенос был не косметикой, а поломкой: список переставал читаться колонкой.
   Причина — раздутый выпадающий список: 17rem съедали место у фамилии.
   Сетка вместо flex даёт имени всё, что осталось, и фиксирует ширину поля. */
.spisok{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));
  gap:0 2.5rem;align-items:start;margin:0 0 1.4rem}
.stroka{display:grid;grid-template-columns:1fr 1.3rem 11.5rem;gap:.7rem;align-items:center;
  padding:.32rem 0;border-bottom:1px solid var(--rule)}
.stroka .kto{font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stroka .kto b{font-weight:600}
.stroka .kl{color:var(--faint);font-size:.86rem;text-align:center}
.stroka select{width:100%;font:inherit;font-size:.98rem;padding:.28em .4em;
  border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--text)}
.stroka select:focus{outline:none;border-color:var(--accent)}
.stroka.net{background:var(--krasn-fon)}
.stroka.net select{border-color:var(--krasn);color:var(--krasn)}

/* ── преподаватели ────────────────────────────────────── */
.prepy{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:0 3rem;margin:0 0 1.4rem}
.prepstroka{display:flex;align-items:center;gap:1rem;padding:.45rem 0;
  border-bottom:1px solid var(--rule)}
.prepstroka .imya{flex:1 1 auto;font-size:1.12rem;font-weight:600}
.prepstroka .n{flex:0 0 2.6rem;text-align:right;font-size:1.25rem;font-weight:700;
  color:var(--muted)}
.prepstroka.malo .n{color:var(--krasn)}
.prepstroka select{flex:0 0 5.5rem;font:inherit;font-size:1.02rem;font-weight:600;
  padding:.3em .4em;border:1px solid var(--rule);border-radius:8px;text-align:center}

/* ── вкладка группы: слева школьники в две колонки, справа преподаватели ──
   У преподавателя школьники идут ТАБЛЕТКАМИ В ТУ ЖЕ СТРОКУ, а не столбиком:
   их 3–5, отдельная строка на каждого растягивала правую колонку вниз на два
   экрана и ради этого же владелец не видел конца списка. */
.troe{display:grid;grid-template-columns:2fr 1.25fr;gap:0 2.5rem;align-items:start}
@media (max-width:1180px){.troe{grid-template-columns:1fr}}
.troe .deti{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
  gap:0 2.5rem;align-items:start}
.karta{display:flex;align-items:baseline;flex-wrap:wrap;gap:.35rem .6rem;
  padding:.45rem 0;border-bottom:1px solid var(--rule)}
.karta .imya{font-size:1.18rem;font-weight:600}
.karta .n{font-size:1.05rem;font-weight:700;color:var(--muted);margin-right:.35rem}
.karta.malo .imya,.karta.malo .n{color:var(--krasn)}
.tabl{display:inline-flex;align-items:center;gap:0;padding:.14em .55em;
  border:1px solid var(--rule);border-radius:999px;background:var(--panel);
  font-size:.85rem;line-height:1.25;cursor:pointer;color:var(--text);white-space:nowrap}
.tabl:hover,.tabl:focus-visible{border-color:var(--krasn);background:var(--krasn-fon);
  color:var(--krasn);outline:none}
/* Крестик занимает место только когда нужен. */
.tabl .x{width:0;overflow:hidden;color:var(--krasn);font-size:1rem;line-height:1;
  transition:width .12s,margin-left .12s}
.tabl:hover .x,.tabl:focus-visible .x{width:.7em;margin-left:.3em}
.nikogo{color:var(--krasn);font-size:.95rem}
.g-В{background:var(--gV-fon);color:var(--gV)}
.g-Д{background:var(--gD-fon);color:var(--gD)}
.g-Н{background:var(--gN-fon);color:var(--gN)}
.chip{padding:.1em .55em;border-radius:6px;font-weight:700;font-size:.95rem}


/* ── сводка внизу: мелко и аккуратно ──────────────────── */
.niz{margin:2.6rem 0 0;padding:.9rem 1.1rem;border:1px solid var(--rule);border-radius:9px;
  background:var(--panel);font-size:.92rem;color:var(--muted);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.5rem 2.5rem}
.niz b{color:var(--krasn);font-weight:600}
.niz .ok{color:var(--accent)}
#soobshchenie{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:.6em 1.3em;border-radius:9px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
#soobshchenie.vidno{opacity:1}
</style>

"use strict";

const ISHODNOE = JSON.parse(document.getElementById('dannye').textContent);

/* 🔴 КЛЮЧ ПАМЯТИ ПРИВЯЗАН К СБОРКЕ, И ЭТО НЕ МЕЛОЧЬ.
   Пока ключ был общий, память ПРОШЛОЙ сборки поднималась в НОВОМ файле молча:
   владелец скачал файл и получил в нём девять детей, расставленных отменённым
   предзаполнением, — то самое, что он запретил, вернулось невидимо и выглядело
   как его собственная работа. Теперь новая сборка = новый ключ: старое состояние
   подняться не может, а тот же файл, открытый повторно, свою память находит. */
const KLYUCH = 'spetsmat-raspredelenie-' + (ISHODNOE.sobrano || '?')
             + '-' + ISHODNOE.shkolniki.length + 'x' + ISHODNOE.prepodavateli.length;
const MALO = 3;                       // «меньше трёх школьников — это очень мало»
const KODY = ['В','Д','Н'];

let sostoyanie = JSON.parse(JSON.stringify(ISHODNOE));
let vkladka = 'shk';                  // школьникам — ПЕРВАЯ, порядок задан владельцем

const ekran = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Память браузера. Файл открыт с диска и сохранить сам себя не может — без этого
   случайно закрытая вкладка стирает работу молча. */
function sohranit(){
  try{
    localStorage.setItem(KLYUCH, JSON.stringify({
      shkolniki: sostoyanie.shkolniki.map(s => [s.id, s.prepodavatel, s.gruppa]),
      prepodavateli: sostoyanie.prepodavateli.map(p => [p.id, p.gruppa]),
      kabinety: sostoyanie.gruppy.map(g => [g.kod, g.kabinet])
    }));
  }catch(e){}
}
function vosstanovit(){
  let syroe = null;
  try{ syroe = localStorage.getItem(KLYUCH); }catch(e){ return; }
  if(!syroe) return;
  let p; try{ p = JSON.parse(syroe); }catch(e){ return; }
  const ps = new Map(sostoyanie.shkolniki.map(s => [s.id, s]));
  (p.shkolniki||[]).forEach(([id,tid,g]) => { const s = ps.get(id);
    if(s){ s.prepodavatel = tid; if(g !== undefined) s.gruppa = g; } });
  const pp = new Map(sostoyanie.prepodavateli.map(x => [x.id, x]));
  (p.prepodavateli||[]).forEach(([id,g]) => { if(pp.has(id)) pp.get(id).gruppa = g; });
  const pg = new Map(sostoyanie.gruppy.map(g => [g.kod, g]));
  (p.kabinety||[]).forEach(([k,v]) => { if(pg.has(k)) pg.get(k).kabinet = v; });
}

const aktivnye = () => sostoyanie.prepodavateli.filter(p => p.aktiven);
const poId = () => new Map(sostoyanie.prepodavateli.map(p => [p.id, p]));

/* 🔴 ГРУППА ШКОЛЬНИКА: у назначенного — от преподавателя, у снятого — ПОМНИТСЯ.
   Без памяти снятый ребёнок исчезал с той самой вкладки, на которой его сняли:
   группу вычисляли из преподавателя, преподавателя не стало — и ребёнок пропал
   ровно в тот момент, когда его надо кому-то отдать. Поле `gruppa` и есть эта
   память: там, где ребёнок числится, пока ему не нашли нового принимающего. */
const gruppaShkolnika = (s, po) => s.prepodavatel === null
  ? (s.gruppa || null)
  : ((po.get(s.prepodavatel) || {}).gruppa || null);

function schet(){
  const m = new Map(aktivnye().map(p => [p.id, 0]));
  sostoyanie.shkolniki.forEach(s => {
    if(m.has(s.prepodavatel)) m.set(s.prepodavatel, m.get(s.prepodavatel) + 1);
  });
  return m;
}

/* ── отрисовка ────────────────────────────────────────── */
function narisovat(){
  const po = poId(), sch = schet();

  document.getElementById('pod').textContent =
    'на ' + sostoyanie.data + ' · ' + sostoyanie.shkolniki.length + ' школьников · '
    + aktivnye().length + ' преподавателей';

  const vkladki = [['shk','школьникам']].concat(KODY.map(k => [k, k]))
    .concat([['prp','преподавателям']]);
  document.getElementById('tabbar').innerHTML = vkladki.map(([k,n]) =>
    '<button data-v="' + k + '"' + (vkladka === k ? ' class="on"' : '') + '>'
    + ekran(n) + '</button>').join('');

  let html = '', vidimye;

  if(vkladka === 'prp'){
    html += '<div class="prepy">'
      + aktivnye().slice().sort((a,b) => a.imya.localeCompare(b.imya,'ru')).map(p => {
        const n = sch.get(p.id) || 0;
        return '<div class="prepstroka' + (n < MALO ? ' malo' : '') + '">'
          + '<span class="imya">' + ekran(p.imya) + '</span>'
          + '<span class="n">' + n + '</span>'
          + '<select class="g-' + ekran(p.gruppa) + '" data-p="' + p.id + '">'
          + KODY.map(k => '<option value="' + k + '"'
              + (k === p.gruppa ? ' selected' : '') + '>' + k + '</option>').join('')
          + '</select></div>';
      }).join('') + '</div>';
    vidimye = sostoyanie.shkolniki;

  } else if(vkladka === 'shk'){
    vidimye = sostoyanie.shkolniki;
    html += '<div class="spisok">' + vidimye.map(s => stroka(s, po, true)).join('') + '</div>';

  } else {
    const g = sostoyanie.gruppy.find(x => x.kod === vkladka);
    const vsego = sostoyanie.shkolniki.filter(s => gruppaShkolnika(s, po) === g.kod);
    const zhdut = vsego.filter(s => s.prepodavatel === null).length;
    html += '<div class="shapka">'
      + '<span class="kod chip g-' + g.kod + '">Группа ' + g.kod + '</span>'
      + '<span class="pole">старший <b>' + ekran(g.starshij) + '</b></span>'
      + '<span class="pole">кабинет <input id="kab" value="' + ekran(g.kabinet || '')
        + '" placeholder="—"></span>'
      + '<span class="pole schet"><b>' + vsego.length + '</b> школьников'
      + (zhdut ? ' · <b class="zhdut">' + zhdut + '</b> ждут' : '') + '</span></div>';

    const svoi = aktivnye().filter(p => p.gruppa === g.kod)
      .sort((a,b) => a.imya.localeCompare(b.imya,'ru'));

    // Дети без группы здесь не показываются: группы у них нет, и приписывать её нельзя.
    vidimye = sostoyanie.shkolniki.filter(s => gruppaShkolnika(s, po) === g.kod);

    html += '<div class="troe">'
      + '<div class="deti">' + vidimye.map(s => stroka(s, po, false)).join('') + '</div>'
      + '<div>'
      + svoi.map(p => {
          const deti = sostoyanie.shkolniki.filter(s => s.prepodavatel === p.id);
          return '<div class="karta' + (deti.length < MALO ? ' malo' : '') + '">'
            + '<span class="imya">' + ekran(p.imya) + '</span>'
            + '<span class="n">' + deti.length + '</span>'
            + (deti.length
                ? deti.map(s => '<button class="tabl" data-snyat="' + s.id + '" title="снять">'
                    + ekran(s.familiya) + '<span class="x">×</span></button>').join('')
                : '<span class="nikogo">никого</span>')
            + '</div>';
        }).join('')
      + '</div></div>';
  }

  html += svodka(vidimye, po, sch);
  document.getElementById('telo').innerHTML = html;
}

function stroka(s, po, pokazatGruppu){
  const g = gruppaShkolnika(s, po);
  return '<div class="stroka' + (s.prepodavatel === null ? ' net' : '') + '">'
    + '<span class="kto">' + (pokazatGruppu && g
        ? '<span class="chip g-' + g + '">' + g + '</span> ' : '')
    + '<b>' + ekran(s.familiya) + '</b> ' + ekran(s.imya) + '</span>'
    + '<span class="kl">' + ekran((s.klass || '').slice(-1)) + '</span>'
    + spisok(s, g) + '</div>';
}

/* Свои первыми: 90 % правок — внутри группы, чужие не должны попадаться раньше своих. */
function spisok(s, g){
  const svoi = [], chuzhie = [];
  aktivnye().forEach(p => (p.gruppa === g ? svoi : chuzhie).push(p));
  const sort = a => a.sort((x,y) => x.imya.localeCompare(y.imya,'ru'));
  const opt = p => '<option value="' + p.id + '"'
    + (p.id === s.prepodavatel ? ' selected' : '') + '>' + ekran(p.imya) + '</option>';
  /* 🔴 ДВЕ РАЗНЫЕ СТУПЕНИ, которые раньше были одной строкой «не назначен».
     Пока они совпадали, ребёнок бывшего преподавателя навсегда оставался в его
     группе: убрать его оттуда было нечем, и группа В держала Савкова, которого
     там нет. Теперь «нигде» и «в группе, но без преподавателя» — разные состояния. */
  let h = '<select data-s="' + s.id + '"><option value=""'
    + (s.prepodavatel === null && !s.gruppa ? ' selected' : '') + '>— нигде</option>'
    + KODY.map(k => '<option value="g:' + k + '"'
        + (s.prepodavatel === null && s.gruppa === k ? ' selected' : '')
        + '>группа ' + k + '</option>').join('');
  if(svoi.length) h += '<optgroup label="группа ' + ekran(g) + '">'
    + sort(svoi).map(opt).join('') + '</optgroup>';
  const pog = {};
  sort(chuzhie).forEach(p => { (pog[p.gruppa] ||= []).push(p); });
  KODY.filter(k => pog[k]).forEach(k => {
    h += '<optgroup label="группа ' + k + '">' + pog[k].map(opt).join('') + '</optgroup>';
  });
  return h + '</select>';
}

/* Сводка внизу, мелко, и она РАЗНАЯ на разных вкладках. */
function svodka(vidimye, po, sch){
  const net = vidimye.filter(s => s.prepodavatel === null);
  // Две ступени считаются ОТДЕЛЬНО: «ждёт преподавателя внутри группы» и «нигде»
  // требуют разных действий, и слипшись в одно число они это скрывали.
  const nigde = sostoyanie.shkolniki.filter(s => s.prepodavatel === null && !s.gruppa);
  const prepy = (vkladka === 'shk' || vkladka === 'prp')
    ? aktivnye() : aktivnye().filter(p => p.gruppa === vkladka);
  const malo = prepy.filter(p => (sch.get(p.id) || 0) < MALO);
  return '<div class="niz"><div>'
    + (net.length
        ? 'Без преподавателя — <b>' + net.length + '</b>: '
          + net.map(s => ekran(s.familiya) + ' ' + ekran(s.imya)).join(', ')
        : '<span class="ok">Все назначены.</span>')
    + '</div><div>'
    + (nigde.length
        ? 'Вне групп — <b>' + nigde.length + '</b>: '
          + nigde.map(s => ekran(s.familiya) + ' ' + ekran(s.imya)).join(', ')
        : '<span class="ok">Вне групп никого.</span>')
    + '</div><div>'
    + (malo.length
        ? 'Меньше трёх школьников — <b>' + malo.length + '</b>: '
          + malo.map(p => ekran(p.imya) + ' (' + (sch.get(p.id)||0) + ')').join(', ')
        : '<span class="ok">У всех не меньше трёх.</span>')
    + '</div></div>';
}

/* ── правки ───────────────────────────────────────────── */
document.addEventListener('change', e => {
  const ss = e.target.closest('select[data-s]');
  if(ss){
    const s = sostoyanie.shkolniki.find(x => x.id === +ss.dataset.s);
    const v = ss.value;
    if(v === ''){                       // нигде: выпадает со всех вкладок групп
      s.prepodavatel = null; s.gruppa = null;
    } else if(v.startsWith('g:')){      // в группе, преподаватель ещё не выбран
      s.prepodavatel = null; s.gruppa = v.slice(2);
    } else {                            // у преподавателя — группа его
      s.prepodavatel = +v;
      s.gruppa = (poId().get(s.prepodavatel) || {}).gruppa || null;
    }
    sohranit(); narisovat(); return;
  }
  const sp = e.target.closest('select[data-p]');
  if(sp){
    // Преподаватель переехал в другую группу — его школьники едут с ним, потому что
    // ребёнок закреплён за ЧЕЛОВЕКОМ, а группу мы из человека и вычисляем.
    const p = sostoyanie.prepodavateli.find(x => x.id === +sp.dataset.p);
    p.gruppa = sp.value;
    sohranit(); narisovat(); return;
  }
  const kab = e.target.closest('#kab');
  if(kab){
    const g = sostoyanie.gruppy.find(x => x.kod === vkladka);
    if(g){ g.kabinet = kab.value.trim(); sohranit(); narisovat(); }
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('#tabbar button');
  if(t){ vkladka = t.dataset.v; narisovat(); return; }

  // Крестик: снять школьника с преподавателя. Он НЕ исчезает — остаётся в своей
  // группе красным, готовым уйти к тому, кого разгружаем в пользу.
  const x = e.target.closest('button[data-snyat]');
  if(x){
    const s = sostoyanie.shkolniki.find(y => y.id === +x.dataset.snyat);
    s.gruppa = gruppaShkolnika(s, poId());   // группу помним — ступень «без преподавателя»
    s.prepodavatel = null;
    sohranit(); narisovat();
  }
});

function skazat(text){
  const el = document.getElementById('soobshchenie');
  el.textContent = text; el.classList.add('vidno');
  setTimeout(() => el.classList.remove('vidno'), 2600);
}

/* Выгрузка отдаёт НОВЫЙ самодостаточный файл: на каждом шаге круга ездит один файл. */
document.getElementById('skachat').addEventListener('click', () => {
  document.getElementById('dannye').textContent = JSON.stringify(sostoyanie);
  document.getElementById('telo').innerHTML = '';
  document.getElementById('tabbar').innerHTML = '';
  const fajl = '<!doctype html>\n<html lang="ru">' + document.documentElement.innerHTML + '</html>';
  narisovat();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([fajl], {type:'text/html;charset=utf-8'}));
  a.download = 'raspredelenie-' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  skazat('Файл скачан — его и пересылайте');
});

document.getElementById('sbros').addEventListener('click', () => {
  if(!window.confirm('Вернуть распределение к тому, как оно пришло? Правки пропадут.')) return;
  try{ localStorage.removeItem(KLYUCH); }catch(e){}
  sostoyanie = JSON.parse(JSON.stringify(ISHODNOE));
  narisovat(); skazat('Вернул как было');
});

vosstanovit();
narisovat();
</script>
</html>
