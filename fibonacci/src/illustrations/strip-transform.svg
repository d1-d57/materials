<svg viewBox="0 0 1120 420" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <!-- Задача 1, доказательство: свёртка столбца 2×n → плитка 1×n.
       ЦВЕТ СОГЛАСОВАН: вертикальная доминошка (зелёная) → зелёный квадрат;
       пара горизонтальных (горчичная) → горчичная доминошка. -->
  <g stroke="var(--ink)" stroke-width="3">
    <!-- слева: 2×4 = вертикаль · пара горизонталей · вертикаль -->
    <rect x="80"  y="110" width="70"  height="200" fill="var(--cgreen)"/>
    <rect x="150" y="110" width="140" height="100" fill="var(--mustard)"/>
    <rect x="150" y="210" width="140" height="100" fill="var(--mustard)"/>
    <rect x="290" y="110" width="70"  height="200" fill="var(--cgreen)"/>
  </g>
  <text x="398" y="232" font-family="'Glacial Indifference',sans-serif" font-size="70" fill="var(--ink)">→</text>
  <g stroke="var(--ink)" stroke-width="3">
    <!-- справа: полоска 1×4 = квадрат · доминошка · квадрат (1×1 vs 1×2) -->
    <rect x="490" y="175" width="70"  height="70" fill="var(--cgreen)"/>
    <rect x="560" y="175" width="140" height="70" fill="var(--mustard)"/>
    <rect x="700" y="175" width="70"  height="70" fill="var(--cgreen)"/>
  </g>
</svg>
