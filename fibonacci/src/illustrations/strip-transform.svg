<svg viewBox="0 0 1120 460" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <!-- Задача 1, сцена 3: свёртка «по верхней строке». Это НЕ новая картинка —
       от уже раскрашенной доски 2×10 (hook-2xn-fill) остаётся её ВЕРХНЯЯ строка = полоска 1×10.
       X-координаты и цвета совпадают с доской: вертикаль → зелёный квадрат, горизонт. пара → горчичная доминошка.
       На кроссфейде 2→3 нижняя строка (y≥224) гаснет, верхняя (y=150..224) остаётся. -->
  <g stroke="var(--ink)" stroke-width="3">
    <rect x="130" y="150" width="74"  height="74" fill="var(--cgreen)"/>
    <rect x="204" y="150" width="148" height="74" fill="var(--mustard)"/>
    <rect x="352" y="150" width="74"  height="74" fill="var(--cgreen)"/>
    <rect x="426" y="150" width="148" height="74" fill="var(--mustard)"/>
    <rect x="574" y="150" width="74"  height="74" fill="var(--cgreen)"/>
    <rect x="648" y="150" width="148" height="74" fill="var(--mustard)"/>
    <rect x="796" y="150" width="74"  height="74" fill="var(--cgreen)"/>
  </g>
</svg>
