<svg viewBox="0 0 1120 420" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <g stroke="var(--ink)" stroke-width="3">
    <!-- слева: столбцы 2×3 -->
    <rect x="60"  y="120" width="70" height="200" fill="var(--mustard)"/>
    <rect x="130" y="120" width="140" height="95"  fill="var(--cgreen)"/>
    <rect x="130" y="215" width="140" height="105" fill="var(--cgreen)"/>
  </g>
  <text x="330" y="235" font-family="'Glacial Indifference',sans-serif" font-size="70" fill="var(--ink)">→</text>
  <g stroke="var(--ink)" stroke-width="3">
    <!-- справа: полоска 1×3 (квадрат + доминошка) -->
    <rect x="440" y="160" width="90"  height="90" fill="var(--cgreen)"/>
    <rect x="530" y="160" width="180" height="90" fill="var(--mustard)"/>
  </g>
</svg>
