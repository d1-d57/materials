# Сборка сайта материалов и публикация на GitHub Pages.
#
# Версия Hugo прибита гвоздём намеренно: сайт должен собираться одинаково
# и сегодня, и через год. Обновлять — руками, отдельным решением.
name: Сборка и публикация сайта

# 🔴 ВЕТКА ЗДЕСЬ — ТОЛЬКО `main`, И МЕНЯТЬ ЕЁ НЕЛЬЗЯ В ОДИНОЧКУ.
# Цена (04.08.2026, коммит 489bdf2): триггер перевели на рабочую ветку, чтобы
# сайт собирался из `sayt/`. Сборка проходила, а GitHub отвергал ПУБЛИКАЦИЮ —
# окружение `github-pages` разрешает деплой только с `main` и `gh-pages`
# (настройка репозитория, в этом файле её не видно). Итог: каждый пуш в
# рабочую ветку — красный прогон и письмо владельцу, тридцать за вечер, и
# сломанный механизм публикации, который никто не заметил бы до правки сайта.
# Одного этого файла мало: ветку публикации знают ДВА места, и второе живёт
# в настройках GitHub. Меняешь здесь — меняй и там, иначе деплой отвергнут.
# Витрину `main` наполняет `git_zona.py opublikovat` (переносит `sayt/`
# рабочей ветки в корень `main`) — см. `_studio/docs/kak-delat/GIT-disciplina.md §4в`.
# Отсюда же `git_zona.py` читает, какую ветку нельзя закрывать (`vetka_publikacii()`).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Поставить Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Выкачать репозиторий
        uses: actions/checkout@v4
      - name: Спросить у Pages базовый адрес
        id: pages
        uses: actions/configure-pages@v5
      - name: Собрать
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Отдать собранное
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
