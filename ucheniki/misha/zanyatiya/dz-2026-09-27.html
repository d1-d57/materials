<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Домашка к 4 октября</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap"><style>:root{--bg:#e9edf3;--paper:#fbfcfe;--ink:#18202e;--muted:#5d6678;--line:#cfd6e2;--acc:#2f5fd0;--acc2:#e6edfb;
--ok:#1d8049;--oks:#dff3e7;--no:#c03636;--nos:#fbe3e3;--amb:#b7791f;--ambs:#fbf0dc;--star:#e8a317;--cell:#ffffff;--fix:#e3e8f1}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;background:var(--paper);display:grid;grid-template-rows:72px 1fr 104px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.top{display:grid;grid-template-columns:400px 1fr auto auto auto;align-items:center;gap:28px;padding:0 28px;border-bottom:2px solid var(--line)}
.sec{font:700 26px/1.1 Rubik,"Golos Text",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec small{display:block;font:500 15px/1.2 "Golos Text",sans-serif;color:var(--muted);margin-top:3px}
.prog{height:16px;border-radius:999px;background:var(--acc2);overflow:hidden;display:flex;gap:3px}
.prog i{display:block;height:100%;background:var(--line)}
.prog i.ok{background:var(--ok)}.prog i.fixed{background:var(--amb)}.prog i.wrong{background:var(--no)}.prog i.cur{box-shadow:inset 0 0 0 3px var(--acc)}
.stars{font:700 30px/1 Rubik,sans-serif;color:var(--star);font-variant-numeric:tabular-nums;cursor:default;user-select:none}
.stars small{font:500 15px "Golos Text",sans-serif;color:var(--muted);margin-left:8px}
.skip{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:22px;cursor:pointer}
main{position:relative;overflow:hidden}
.item{position:absolute;inset:0;display:flex;flex-direction:column;padding:26px 56px 18px}
.q{font:500 36px/1.3 "Golos Text",sans-serif;margin:0 0 10px;text-wrap:balance}
.q .sub{display:block;font-size:28px;color:var(--muted);font-weight:500;margin-top:6px}
.q:empty{display:none}
.work{flex:1;position:relative;min-height:0}
.fit{position:absolute;left:50%;top:50%;width:max-content;transform-origin:center center}
.lines{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.ln{font:500 44px/1.2 "Golos Text",sans-serif;font-variant-numeric:tabular-nums;display:flex;align-items:center;flex-wrap:nowrap;gap:.25em;white-space:nowrap}
.slot{font:inherit;font-size:40px;height:62px;min-width:2.4ch;padding:0 .2em;border:3px solid var(--line);border-radius:12px;background:var(--cell);color:var(--acc);text-align:center;font-weight:700}
.slot:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.slot.free{color:var(--ink);border-style:dashed;font-weight:500}
.slot.bad,.seg.bad{border-color:var(--no);background:var(--nos)}
.slot.good{border-color:var(--ok);background:var(--oks)}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:12px;overflow:hidden;background:var(--cell)}
.seg button{font:700 38px/1 "Golos Text",sans-serif;min-width:64px;height:58px;border:0;border-right:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.seg.good{border-color:var(--ok)}
.draft{display:flex;flex-direction:column;gap:10px;margin-top:20px;width:900px}
.draft input{font:500 30px "Golos Text",sans-serif;height:52px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);padding:0 8px}
.draft input:focus{outline:none;border-bottom-color:var(--acc)}
.draft .lbl{font-size:20px;color:var(--muted)}
.opts{display:grid;gap:18px}
.opt{font:600 36px/1.2 "Golos Text",sans-serif;padding:18px 26px;border:3px solid var(--line);border-radius:16px;background:var(--cell);color:var(--ink);cursor:pointer;text-align:center;min-width:220px}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt.good{border-color:var(--ok);background:var(--oks)}.opt.bad{border-color:var(--no);background:var(--nos)}
.opt svg{display:block;width:380px;height:auto}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.step{font:500 42px/1.2 "Golos Text",sans-serif;text-align:left;padding:10px 26px;border:3px solid var(--line);border-radius:14px;background:var(--cell);color:var(--ink);cursor:pointer;white-space:nowrap}
.step .who{color:var(--muted);font-size:26px;margin-right:12px}
.step.on{border-color:var(--no);background:var(--nos)}
.step.good{border-color:var(--ok);background:var(--oks)}
.fixlbl{font:500 26px "Golos Text",sans-serif;color:var(--muted);margin-bottom:10px}
.row2{display:flex;gap:56px;align-items:center}
.euler svg{display:block;width:620px;height:auto}
/* головоломки */
.pz{display:flex;gap:44px;align-items:center}
.pgrid{display:grid;gap:0;background:var(--ink);border:4px solid var(--ink);border-radius:6px}
.pgrid.fut{background:transparent;border:0;gap:0;align-items:center;justify-items:center}
.pc{width:96px;height:96px;border:1px solid var(--line);background:var(--cell);font:700 54px/1 Rubik,"Golos Text",sans-serif;color:var(--acc);cursor:pointer;padding:0;display:grid;place-items:center}
.fut .pc{border:3px solid var(--ink);border-radius:8px}
.pc.fix{color:var(--ink);background:var(--fix);cursor:default}
.pc.sel{box-shadow:inset 0 0 0 5px var(--acc)}
.pc.bad{background:var(--nos)}
.pc.bR{border-right:4px solid var(--ink)}.pc.bB{border-bottom:4px solid var(--ink)}
.sg{width:44px;height:44px;display:grid;place-items:center;font:700 36px/1 Rubik,sans-serif;color:var(--ink)}
.dot{width:66%;height:66%;border-radius:50%;border:4px solid var(--ink)}.dot.b{background:var(--ink)}.dot.w{background:#fff}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:300px}
.pal button{height:92px;border-radius:16px;border:3px solid var(--line);background:var(--cell);font:700 46px/1 Rubik,sans-serif;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pal button.on{border-color:var(--acc);background:var(--acc2)}
.pal button.wide{grid-column:span 2;font-size:26px;height:64px}
.pal .dot{width:48px;height:48px}
.rules{font:400 21px/1.35 "Golos Text",sans-serif;color:var(--muted);margin-top:16px;width:300px}
/* низ */
.bot{display:grid;grid-template-columns:120px 1fr 220px 300px 120px;align-items:center;gap:22px;padding:0 28px;border-top:2px solid var(--line)}
.bot button{height:72px;border-radius:16px;border:3px solid var(--line);background:var(--cell);font:700 30px/1 "Golos Text",sans-serif;color:var(--ink);cursor:pointer}
.bot button:disabled{opacity:.3;cursor:not-allowed}
.bot .chk{background:var(--acc);border-color:var(--acc);color:#fff;font-size:32px}
.bot .chk.ok{background:var(--ok);border-color:var(--ok)}.bot .chk.no{background:var(--no);border-color:var(--no)}
.dots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dots b{width:22px;height:22px;border-radius:50%;background:var(--line);display:block}
.dots b.ok{background:var(--ok)}.dots b.fixed{background:var(--amb)}.dots b.wrong{background:var(--no)}.dots b.cur{outline:4px solid var(--acc);outline-offset:3px}
button:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
/* экраны-обложки */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:40px}
.cover h1{font:700 96px/1.1 Rubik,sans-serif;margin:0}
.cover p{font:400 38px/1.4 "Golos Text",sans-serif;color:var(--muted);margin:0;max-width:1000px}
.cover .big{font:700 34px "Golos Text",sans-serif;height:88px;padding:0 60px;border-radius:20px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.cover .sum{font:700 120px/1 Rubik,sans-serif;color:var(--star)}
/* панели */
.ov{position:absolute;inset:0;background:rgba(20,26,38,.55);display:flex;align-items:center;justify-content:center;z-index:10}
.ov[hidden]{display:none}
.panel{background:var(--paper);border-radius:20px;padding:28px 34px;width:1240px;max-height:740px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.panel h2{font:700 30px Rubik,sans-serif;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.panel table{border-collapse:collapse;width:100%;font:500 19px "Golos Text",sans-serif;font-variant-numeric:tabular-nums}
.panel td,.panel th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
.panel .acts{display:flex;gap:12px;margin:16px 0 0;flex-wrap:wrap}
.panel button{font:600 20px "Golos Text",sans-serif;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--cell);cursor:pointer}
.jump{display:flex;flex-direction:column;gap:14px}
.jump .jr{display:flex;align-items:center;gap:14px;font:600 22px "Golos Text",sans-serif}
.jump .jr span{width:340px}
.jump .jr button{width:44px;height:44px;border-radius:10px;padding:0}
.jump .jr button.ok{background:var(--oks);border-color:var(--ok)}.jump .jr button.fixed{background:var(--ambs);border-color:var(--amb)}.jump .jr button.wrong{background:var(--nos);border-color:var(--no)}
.toast{position:absolute;left:50%;top:8px;z-index:5;transform:translateX(-50%);font:700 40px Rubik,sans-serif;padding:14px 34px;border-radius:18px;background:var(--oks);color:var(--ok);pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}.toast.no{background:var(--nos);color:var(--no)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.badge{font:700 24px/1 Rubik,"Golos Text",sans-serif;color:var(--acc);background:var(--acc2);padding:10px 16px;border-radius:12px;white-space:nowrap}.badge:empty{display:none}

.bot .prev,.bot .next{font-size:44px}
.sec{font-size:28px}
.drow{display:flex;gap:60px;align-items:center}
.draft{margin-top:0;width:620px;padding:18px 26px;border:3px solid var(--line);border-radius:18px;background:#fff}
.draft input{border-bottom:2px solid var(--line)}
.draft .lbl{font-size:22px}.draft .lbl:empty{display:none}

.step.fx{cursor:default;display:flex;align-items:center;gap:0;white-space:pre}
.num{font:inherit;width:2ch;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink);text-align:center;padding:0;border-radius:6px;cursor:text}
.num:hover{background:var(--acc2)}
.num:focus{outline:none;background:var(--acc2);border-bottom-style:solid}
.num.ed{color:var(--acc);font-weight:700}
.cmp{display:inline-block;min-width:1ch;text-align:center}
.cmp.flash{animation:fl 1s ease-out}
@keyframes fl{0%{background:#ffe9a8;color:var(--acc)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.cmp.flash{animation:none}}

  const g=el("div","pgrid"+(fut?" fut":""));g.style.gridTemplateColumns=`repeat(${G},auto)`;
  const cells=[];const sign=(a,b)=>{for(const [x,y] of (it.ineq||[])){if(x[0]===a[0]&&x[1]===a[1]&&y[0]===b[0]&&y[1]===b[1])return "<";if(x[0]===b[0]&&x[1]===b[1]&&y[0]===a[0]&&y[1]===a[1])return ">";}return "";};
  const put=(i,j,v,noUndo)=>{if(fixed[i][j])return;if(!noUndo)undo.push([i,j,st[i][j]]);st[i][j]=v;cells[i][j].innerHTML=show(v);cells[i][j].classList.remove("bad");ctx.touch();};
  const pick=(i,j)=>{sel=[i,j];cells.flat().forEach(c=>c.classList.remove("sel"));cells[i][j].classList.add("sel");};
  for(let R=0;R<G;R++)for(let C=0;C<G;C++){
    if(!fut||(R%2===0&&C%2===0)){const i=fut?R/2:R,j=fut?C/2:C;(cells[i]=cells[i]||[]);
      const b=el("button","pc"+(fixed[i][j]?" fix":""),show(st[i][j]));b.type="button";
      if(it.kind==="sudoku"){const bs=Math.sqrt(n)|0;if((j+1)%bs===0&&j<n-1)b.classList.add("bR");if((i+1)%bs===0&&i<n-1)b.classList.add("bB");}
      b.onclick=()=>{if(fixed[i][j])return;pick(i,j);if(brush!==null)put(i,j,brush==="x"?null:brush);
        else{const cur=st[i][j];const k=cur===null?0:vals.indexOf(cur)+1;put(i,j,k>=vals.length?null:vals[k]);}};
      cells[i][j]=b;g.appendChild(b);}
    else if(R%2===0){g.appendChild(el("span","sg",sign([R/2,(C-1)/2],[R/2,(C+1)/2])));}
    else if(C%2===0){const t=sign([(R-1)/2,C/2],[(R+1)/2,C/2]);g.appendChild(el("span","sg",t==="<"?"∧":t===">"?"∨":""));}
    else g.appendChild(el("span","sg"));}
  const pal=el("div","pal");const pbs=[];
  vals.forEach(v=>{const b=el("button","",show(v));b.type="button";b.onclick=()=>{brush=brush===v?null:v;pbs.forEach(x=>x.classList.toggle("on",x._v===brush));};b._v=v;pbs.push(b);pal.appendChild(b);});
  const er=el("button","wide","стереть");er.type="button";er._v="x";er.onclick=()=>{brush=brush==="x"?null:"x";pbs.forEach(x=>x.classList.toggle("on",x._v===brush));};pbs.push(er);pal.appendChild(er);
  
  const un=el("button","wide","↶ отменить ход");un.type="button";un.onclick=()=>{const u=undo.pop();if(u)put(u[0],u[1],u[2],true);};pal.appendChild(un);
  wrap.appendChild(g);const side=el("div");side.appendChild(pal);if(it.rules)side.appendChild(el("div","rules",it.rules));wrap.appendChild(side);
  const inner=el("div","fit");inner.appendChild(wrap);box.appendChild(inner);ctx.inner=inner;ctx.maxScale=1.6;
  ctx.key=e=>{if(!sel)return false;const [i,j]=sel;
    if(/^Arrow/.test(e.key)){const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];pick((i+d[0]+n)%n,(j+d[1]+n)%n);return true;}
    if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"&&!tak){put(i,j,null);return true;}
    if(tak){if(e.key==="1"||e.key.toLowerCase()==="ч"||e.key.toLowerCase()==="b"){put(i,j,1);return true;}if(e.key==="0"||e.key.toLowerCase()==="б"||e.key.toLowerCase()==="w"){put(i,j,0);return true;}}
    else{const v=+e.key;if(v>=1&&v<=n){put(i,j,v);return true;}}return false;};
  ctx.slots.push({kind:"free",node:{},get:()=>st.map(r=>r.map(v=>v===null?".":v).join("")).join("/"),set:v=>{if(!v)return;v.split("/").forEach((r,i)=>[...r].forEach((c,j)=>{if(!fixed[i][j]){st[i][j]=c==="."?null:+c;cells[i][j].innerHTML=show(st[i][j]);}}));}});
  return {check(){if(st.some(r=>r.some(v=>v===null)))return null;
      const line=a=>tak?(a.filter(x=>x===1).length===n/2&&!/000|111/.test(a.join(""))):new Set(a).size===n;
      let ok=st.every(line);for(let j=0;j<n;j++)ok=ok&&line(st.map(r=>r[j]));
      if(tak){ok=ok&&new Set(st.map(r=>r.join(""))).size===n&&new Set(st[0].map((_,j)=>st.map(r=>r[j]).join(""))).size===n;}
      if(it.kind==="sudoku"){const bs=Math.sqrt(n)|0;for(let a=0;a<n;a+=bs)for(let b=0;b<n;b+=bs){const q=[];for(let x=0;x<bs;x++)for(let y=0;y<bs;y++)q.push(st[a+x][b+y]);ok=ok&&new Set(q).size===n;}}
      if(fut)ok=ok&&(it.ineq||[]).every(([a,b])=>st[a[0]][a[1]]<st[b[0]][b[1]]);
      return ok;},
    reset(){for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(!fixed[i][j]){st[i][j]=null;cells[i][j].innerHTML="";cells[i][j].classList.remove("bad");}undo.length=0;}};};

/* ---------- показ пункта ---------- */
let pos=S.pos&&flat.findIndex(f=>f.si===S.pos[0]&&f.ii===S.pos[1]);if(pos==null||pos<0)pos=0;
let cur=null, openedAt=0;
function curKey(){return flat[pos]?flat[pos].k:"";}
function statusOf(k){const r=S.it[k];return r?r.st:"";}
function show(){const f=flat[pos];const it=f.it;main.innerHTML="";S.pos=[f.si,f.ii];save();
  const sec=L.sections[f.si];secEl.innerHTML=`${sec.title}<small>${sec.sub||""}</small>`;
  if(it.type==="cover"){const c=el("div","cover");c.innerHTML=`<h1>${it.title}</h1>${it.text?`<p>${it.text}</p>`:""}`;
    if(it.final){c.innerHTML+=`<div class="sum">★ ${S.stars}</div>`;}
    else{const b=el("button","big",it.button||"Начать");b.onclick=()=>{rec(f.k).att=1;rec(f.k).st="ok";go(pos+1);};c.appendChild(b);}
    main.appendChild(c);cur={check(){return null},reset(){}};bChk.style.visibility="hidden";bRst.style.visibility="hidden";paintNav();return;}
  bChk.style.visibility="";bRst.style.visibility="";
  const box=el("div","item");const q=el("p","q",it.q+(it.sub?`<span class="sub">${it.sub}</span>`:""));if(it.q)box.appendChild(q);
  const work=el("div","work");box.appendChild(work);main.appendChild(box);
  const ctx={slots:[],touch(){const r=rec(f.k);r.v=ctx.slots.map(s=>s.get());save();const t=now();if(t-(ctx._lt||0)>4000){ctx._lt=t;log("in");}}};
  const api=T[it.type](it,work,ctx);cur=Object.assign(api,{ctx,it,k:f.k});
  const r=S.it[f.k];if(r&&r.v)ctx.slots.forEach((s,i)=>{try{s.set(r.v[i])}catch(e){}});
  if(ctx.inner){cur.fit=fitter(work,ctx.inner,ctx.maxScale||it.maxScale);requestAnimationFrame(cur.fit);}
  openedAt=now();log("open");paintNav();
  const first=work.querySelector("input.slot:not(.free)");if(first)setTimeout(()=>first.focus({preventScroll:true}),50);}
function paintNav(){const f=flat[pos];const sec=L.sections[f.si];
  dots.innerHTML="";sec.items.forEach((it,ii)=>{const k=f.si+"."+ii;const b=el("b",statusOf(k)+(ii===f.ii?" cur":""));dots.appendChild(b);});
  prog.innerHTML="";flat.forEach((x,i)=>{if(x.it.type==="cover")return;const s=el("i",statusOf(x.k)+(i===pos?" cur":""));s.style.flex="1";prog.appendChild(s);});
  const r=S.it[f.k];bPrev.disabled=pos===0;bNext.disabled=pos===flat.length-1||!(r&&r.att>0||f.it.optional||f.it.type==="grid");
  bChk.classList.remove("ok","no");if(r&&r.att>0){bChk.classList.add(r.st==="wrong"?"no":"ok");}
  bChk.textContent=r&&r.att>0?(r.st==="wrong"?"✗ Ещё раз":"✓ Верно"):"✓ Проверить";
  $(".stars b",stage).textContent=S.stars;$(".stars small",stage).textContent=total>S.stars?"всего "+total:"";}
function go(i,how){if(i<0||i>=flat.length)return;log("leave",{dur:now()-openedAt});pos=i;if(how)log(how);show();}
function check(){if(!cur||!cur.check)return;const res=cur.check();if(res===null){say("Заполни всё",false);return;}
  const r=rec(cur.k);r.att++;const first=r.att===1;
  if(res){r.st=first?"ok":"fixed";if(first){S.stars++;total++;try{localStorage.setItem(SKEY,String(total))}catch(e){}}say(first?"Верно! ★":"Верно",true);}
  else{r.st="wrong";say("Неверно",false);}
  r.v=cur.ctx.slots.map(s=>s.get());if(!r.t0)r.t0=openedAt;if(res&&!r.t1)r.t1=now();
  log("check",{ok:res,att:r.att,v:r.v});paintNav();}
let tt;function say(t,ok){toast.textContent=t;toast.className="toast show"+(ok?"":" no");clearTimeout(tt);tt=setTimeout(()=>toast.className="toast"+(ok?"":" no"),1100);}
bPrev.onclick=()=>go(pos-1);bNext.onclick=()=>{if(!bNext.disabled)go(pos+1);};bChk.onclick=check;
bRst.onclick=()=>{if(!cur)return;cur.reset();const r=rec(cur.k);r.v=null;save();log("reset");};
addEventListener("keydown",e=>{if(!ov.hidden){if(e.key==="Escape")ov.hidden=true;return;}
  if(e.ctrlKey&&e.shiftKey&&(e.code==="KeyJ")){e.preventDefault();journal();return;}
  if(cur&&cur.ctx&&cur.ctx.key&&cur.ctx.key(e)){e.preventDefault();return;}
  if(e.key==="Enter"){e.preventDefault();const r=S.it[curKey()];if(r&&r.att>0&&r.st!=="wrong"&&!bNext.disabled)go(pos+1);else check();}});

/* ---------- скип (для репетитора) ---------- */
$(".skip",stage).onclick=()=>{const p=el("div","panel");p.innerHTML=`<h2>Перейти к задаче <button>✕</button></h2>`;const j=el("div","jump");
  L.sections.forEach((s,si)=>{const row=el("div","jr");row.appendChild(el("span","",s.title));s.items.forEach((it,ii)=>{const b=el("button",statusOf(si+"."+ii),String(ii+1));
    b.onclick=()=>{ov.hidden=true;go(flat.findIndex(f=>f.si===si&&f.ii===ii),"skip");};row.appendChild(b);});j.appendChild(row);});
  p.appendChild(j);ov.innerHTML="";ov.appendChild(p);ov.hidden=false;$("h2 button",p).onclick=()=>ov.hidden=true;};

/* ---------- журнал (Ctrl+Shift+J или долгое нажатие на звёзды) ---------- */
function summary(){const rows=[];const ev=S.ev;
  flat.forEach(f=>{if(f.it.type==="cover")return;const E=ev.filter(x=>x.k===f.k);if(!E.length){rows.push({f,att:0});return;}
    let active=0,openT=null,firstOpen=E[0].t,lastT=E[0].t,idle=0,prev=null;
    E.forEach(x=>{if(x.e==="open")openT=x.t;if(x.e==="leave"&&openT){active+=x.t-openT;openT=null;}if(prev&&x.t-prev>90000&&x.e!=="open")idle+=x.t-prev;prev=x.t;lastT=x.t;});
    if(openT&&f.k===curKey())active+=now()-openT;
    const r=S.it[f.k]||{};const firstOk=E.find(x=>x.e==="check"&&x.ok);
    rows.push({f,start:firstOpen,end:firstOk?firstOk.t:null,active,att:r.att||0,st:r.st||"",idle});});return rows;}
const hm=t=>t?new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):"—";
const mm=ms=>ms?(Math.floor(ms/60000)+":"+String(Math.round(ms/1000)%60).padStart(2,"0")):"—";
function journal(){const rows=summary();const p=el("div","panel");
  const stt={ok:"✓ с первой",fixed:"✓ со второй+",wrong:"✗",'':"—"};
  let h=`<h2>Журнал: ${L.title} <button>✕</button></h2><table><tr><th>задача</th><th>открыл</th><th>решил</th><th>время</th><th>попыток</th><th>итог</th><th>простой &gt;1,5 мин</th></tr>`;
  rows.forEach(x=>{const s=L.sections[x.f.si];h+=`<tr><td>${s.title} · ${x.f.ii+1}</td><td>${hm(x.start)}</td><td>${hm(x.end)}</td><td>${mm(x.active)}</td><td>${x.att}</td><td>${stt[x.st||""]}</td><td>${mm(x.idle)}</td></tr>`;});
  h+=`</table><div class="acts"><button data-a="copy">скопировать таблицу</button><button data-a="json">скачать журнал (JSON)</button><button data-a="clr">стереть прогресс этого занятия</button></div>`;
  p.innerHTML=h;ov.innerHTML="";ov.appendChild(p);ov.hidden=false;$("h2 button",p).onclick=()=>ov.hidden=true;
  p.querySelector(".acts").onclick=e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==="copy"){const txt=rows.map(x=>[L.sections[x.f.si].title+" · "+(x.f.ii+1),hm(x.start),hm(x.end),mm(x.active),x.att,x.st].join("\t")).join("\n");
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>e.target.textContent="скопировано",()=>e.target.textContent="не вышло");}
    if(a==="json"){const blob=new Blob([JSON.stringify({lesson:L.id,title:L.title,items:S.it,events:S.ev},null,1)],{type:"application/json"});
      const u=URL.createObjectURL(blob);const x=document.createElement("a");x.href=u;x.download=`zhurnal-${L.id}.json`;document.body.appendChild(x);x.click();x.remove();}
    if(a==="clr"){if(e.target.dataset.sure){localStorage.removeItem(KEY);location.reload();}else{e.target.dataset.sure=1;e.target.textContent="точно стереть? нажми ещё раз";}}};}
let lp;const stEl=$(".stars",stage);stEl.onpointerdown=()=>{lp=setTimeout(journal,1200);};stEl.onpointerup=stEl.onpointerleave=()=>clearTimeout(lp);
addEventListener("visibilitychange",()=>log(document.hidden?"hide":"show"));

scale();show();
})();
</script></body></html>
