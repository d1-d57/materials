baseURL: "https://d1-d57.github.io/materials/"
locale: ru
title: Материалы

# Ни тегов, ни рубрик, ни ленты тут нет — сайт это один список и файлы.
# Без этого Hugo плодит пустые /tags/, /categories/ и index.xml.
disableKinds: ["taxonomy", "term", "rss"]

# Готовые материалы (деки, pdf, статьи) лежат в static/ и копируются на сайт
# ДОСЛОВНО, теми же адресами — старые ссылки из постов не должны сломаться.
# Список на титульной собирается не из них, а из data/spisok.yaml.

markup:
  goldmark:
    renderer:
      unsafe: true
