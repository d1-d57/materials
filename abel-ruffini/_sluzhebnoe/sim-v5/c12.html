<div class="sim-cap">Слева плоскость коэффициентов $(p,q)$ трёхчлена $x^2+px+q$, справа графики. Цветные точки — три трёхчлена-образца, их графики тех же цветов; чёрную точку можно тащить, её график жирный: под параболой корней два, на ней один, над ней (закрашено) ни одного.</div>
