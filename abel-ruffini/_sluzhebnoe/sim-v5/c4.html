<svg viewBox="0 0 650 310" role="img" aria-label="Интерактив: плоскость параметра a с четырьмя точками дискриминанта и пять корней многочлена x в пятой минус x плюс a; петли вокруг точек переставляют корни"></svg><div class="sim-bar"><button type="button">вокруг +a*</button><button type="button">вокруг −a*</button><button type="button">вокруг +ia*</button><button type="button">вокруг −ia*</button><button type="button">заново</button></div><div class="sim-out"></div><div class="sim-cap">Слева плоскость параметра $a$: крестики — точки дискриминанта, точку $a$ можно тащить или пустить по петле кнопкой. Справа пять корней $x^5-x+a$; пунктирные кружки — места корней при $a=0$. Под рисунком видно, какой корень оказался на каком месте после обходов.</div>
