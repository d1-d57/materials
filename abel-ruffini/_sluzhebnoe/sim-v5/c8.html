<svg viewBox="0 0 650 295" role="img" aria-label="Интерактив: коэффициенты многочлена пятой степени меняются вдоль пути, справа его график и три вещественных корня, которые ни разу не сталкиваются; внизу следы корней"></svg>
<div class="sim-bar"><label style="display:inline-flex;align-items:center;gap:.5em">s <input type="range" min="0" max="1" step="0.001" value="0" aria-label="параметр пути s" style="width:min(240px,52vw);accent-color:var(--accent)"></label><button type="button">пройти путь</button></div>
<div class="sim-out"></div>
<div class="sim-cap">Слева коэффициенты $f_s(x)=x^5+a_1x^4+a_2x^3+a_3x^2+a_4x+a_5$ вдоль пути $f_s=(1-s)f_0+sf_1+\sin(\pi s)\,(x^3-x)$; $s$ двигает ползунок или кнопка. Справа график $f_s$ и его три вещественных корня, внизу их следы ($s$ растёт сверху вниз): следы не пересекаются, корни ни разу не сливаются.</div>
