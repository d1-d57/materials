<svg viewBox="0 0 650 300" role="img" aria-label="Интерактив: параметр лямбда обходит ноль по окружности, пять корней многочлена x в пятой плюс лямбда поворачиваются на пятую часть оборота и переходят друг в друга по циклу"></svg><div class="sim-bar"><button type="button">обойти ноль</button><button type="button">заново</button></div><div class="sim-out"></div><div class="sim-cap">Слева $\lambda$ обходит ноль по окружности, справа пять корней $x^5+\lambda$; пунктирные кружки отмечают, где каждый корень стоял вначале. За один обход каждый корень проходит пятую часть оборота и встаёт на место соседа — корни сдвигаются по циклу.</div>
