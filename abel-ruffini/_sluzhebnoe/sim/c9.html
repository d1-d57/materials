<svg viewBox="0 0 650 300" role="img" aria-label="Интерактив: слева плоскость z с корнями многочлена и окружностью, справа образ окружности под действием многочлена и число его оборотов вокруг нуля"></svg><div class="sim-bar"><label class="c9-ctl">радиус <input class="c9-r" type="range" min="0.1" max="2" step="0.01" value="0.6"><span class="c9-v c9-rv">0,60</span></label><label class="c9-ctl">шевелить коэффициент <input class="c9-d" type="range" min="-0.5" max="0.5" step="0.01" value="0"><span class="c9-v c9-dv">0,00</span></label></div><div class="sim-out"></div><div class="sim-cap">Слева корни многочлена $f(z)=z^3-z+0{,}4+\delta$ и окружность, её центр можно перетаскивать; справа кривая, которую пробегает $f(z)$, когда $z$ обходит окружность. Число её оборотов вокруг нуля равно числу корней внутри окружности и не меняется, пока окружность не проходит через корень.</div>
