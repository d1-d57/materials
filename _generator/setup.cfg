# Метаданные пакета живут ЗДЕСЬ, а не в pyproject.toml, и это замер, а не вкус.
# В боевой среде стоит setuptools 58.0.4 (системный python3 3.9.6, Command Line
# Tools) — он таблицу `[project]` из pyproject.toml не читает вовсе: пакет с
# метаданными там встаёт как «UNKNOWN 0.0.0», без имени и без консольной команды
# (проверено установкой пакета-пробы). setup.cfg читают и он, и современный
# setuptools, поэтому дом метаданных один и работает по обе стороны обновления.
[metadata]
name = dvizhki
version = 1.0.0
description = Движки _generator, адресуемые именем, а не местом

[options]
py_modules = dvizhki
python_requires = >=3.8

[options.entry_points]
console_scripts =
    dvizhki = dvizhki:main
