# Только бэкенд сборки. Метаданные намеренно НЕ здесь — см. шапку setup.cfg:
# боевой setuptools 58 таблицу `[project]` не читает, и разложить метаданные по
# двум файлам значило бы завести два дома одного ответа, которые разъедутся молча.
[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"
