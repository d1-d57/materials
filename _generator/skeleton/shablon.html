<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Новый дек</title>
<!-- ============================================================
  КАНОН-СКЕЛЕТ (замороженный канон, KONSTITUCIYA §1). Четыре блока:
    [1] DECK STYLES  — токены, шрифты, base.css (общий канон), пер-слайдовые гриды
    [2] SLIDES       — только текст и зоны (арка 7 добавляет {{SLIDE:<id>}})
    [3] ASSETS       — иллюстрации в <template> (арка 9)
    [4] ENGINE       — движок дословно, не править
  Холст 1440×810. Стартовая точка greenfield-дека Фазы II («скопируй скелет»).
  Общий канон-CSS вынесен в base.css; пер-слайдовый грид — bespoke, здесь ПУСТ.
============================================================ -->
<style>
/* ===== [1] DECK STYLES ===== */
/* шрифты грузятся по относительному пути при сборке; base64-вшиты в выход */
{{FONTS_CSS}}

{{TOKENS_CSS}}
{{BASE_CSS}}

/* ---------- пер-слайдовые гриды (bespoke — добавляет арка 7 «вёрстка») ---------- */
/* напр.:  #s01 .grid{ position:absolute; inset:0; display:grid;
             grid-template-columns:34px 1372px 34px; grid-template-rows:18px 210px 582px; }
           #s01 .copy{ grid-area:2/2; } */
</style>
</head>
<body>
<div id="stage"><div id="deck">

<!-- ===== [2] SLIDES — арка 7 добавляет {{SLIDE:<id>}} в порядке brief.slide_order ===== -->

</div></div>
<div id="lect-zone" style="position:fixed;left:0;bottom:0;width:100%;height:14px;z-index:200;cursor:pointer"></div>
<div id="lect-progress" style="position:fixed;left:0;bottom:0;height:2.5px;width:0;
  background:var(--brick);opacity:.55;z-index:201;pointer-events:none;transition:width .25s ease,height .15s ease,opacity .15s ease"></div>
<div id="hint">← → листать · F — экран · B — чёрный · O — обзор</div>

<!-- ===== [3] ASSETS REGISTRY — арка 9 добавляет <template id="ill-<name>"> ===== -->

<script>{{ENGINE_JS}}</script>

<script>
/* Прогресс лекции по hash — движок не трогаем (чистый шов, канон-паттерн). */
(function () {
  var total = document.querySelectorAll('.slide').length;
  var bar = document.getElementById('lect-progress');
  var zone = document.getElementById('lect-zone');
  var hint = document.getElementById('hint');
  function upd() {
    var m = location.hash.match(/^#s(\d+)/), i = m ? +m[1] : 0;
    if (bar) bar.style.width = (total ? 100 * (i + 1) / total : 0) + '%';
  }
  addEventListener('hashchange', upd); setInterval(upd, 400); upd();
  hint.classList.add('is-shown');
  setTimeout(function () { hint.classList.remove('is-shown'); }, 6000);
  zone.addEventListener('mouseenter', function () {
    bar.style.height = '6px'; bar.style.opacity = '.85'; hint.classList.add('is-shown'); });
  zone.addEventListener('mouseleave', function () {
    bar.style.height = '2.5px'; bar.style.opacity = '.55'; hint.classList.remove('is-shown'); });
  zone.addEventListener('click', function (e) {
    var i = Math.min(total - 1, Math.floor(e.clientX / innerWidth * total));
    if (typeof showSingle === 'function') { showSingle(i, 1); if (typeof syncHash === 'function') syncHash(); }
  });
})();
</script>
</body>
</html>
