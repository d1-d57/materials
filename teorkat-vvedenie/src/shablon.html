<script>
/* Прогресс лекции по hash — движок не трогаем (чистый шов, канон-паттерн). */
(function () {
  var total = document.querySelectorAll('.slide').length;
  var bar = document.getElementById('lect-progress');
  var zone = document.getElementById('lect-zone');
  var hint = document.getElementById('hint');
  function upd() {
    var m = location.hash.match(/^#s(\d+)/), i = m ? +m[1] : 0;
    if (bar) bar.style.width = (total ? 100 * (i + 1) / total : 0) + '%';
  }
  addEventListener('hashchange', upd); setInterval(upd, 400); upd();
  hint.classList.add('is-shown');
  setTimeout(function () { hint.classList.remove('is-shown'); }, 6000);
  zone.addEventListener('mouseenter', function () {
    bar.style.height = '6px'; bar.style.opacity = '.85'; hint.classList.add('is-shown'); });
  zone.addEventListener('mouseleave', function () {
    bar.style.height = '2.5px'; bar.style.opacity = '.55'; hint.classList.remove('is-shown'); });
  zone.addEventListener('click', function (e) {
    var i = Math.min(total - 1, Math.floor(e.clientX / innerWidth * total));
    if (typeof showSingle === 'function') { showSingle(i, 1); if (typeof syncHash === 'function') syncHash(); }
  });
})();
</script>
