<svg viewBox="0 0 840 226" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block" role="img" aria-label="Слева три столбика по четыре точки — три экземпляра одного четырёхэлементного множества. От первого столбика ко второму идут стрелки перестановки сигма, от второго к третьему — стрелки перестановки тау; путь одной точки через оба шага выделен цветом, и видно, что после двух шагов она стоит на новой высоте. Под столбиками дуга со стрелкой ведёт от первого столбика прямо к третьему и подписана тау после сигма: два шага дали одну стрелку. Справа тот же приём с тождественной: первый шаг — та же перестановка сигма, второй шаг — четыре ровные горизонтальные стрелки, подписанные единицей, третий столбик повторяет второй точка в точку, выделенная точка не сдвинулась; дуга под столбиками подписана единица после сигма">
