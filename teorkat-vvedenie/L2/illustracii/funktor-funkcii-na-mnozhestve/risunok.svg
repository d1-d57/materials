<svg viewBox="0 0 1800 258" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block" role="img" aria-label="Два яруса. Вверху два трёхэлементных множества X и Y, в каждом три точки — сиреневая, синяя и зелёная; стрелка сигма переименовывает: в X точки идут в порядке сиреневая, синяя, зелёная, а в Y — зелёная, сиреневая, синяя. Внизу два пространства функций: эр в степени икс и эр в степени игрек. Каждое изображено не точками, а тройкой столбиков на общем основании — это одна функция, а высота столбика есть её значение в соответствующей точке. Столбиков ровно три, столько же, сколько точек вверху; каждый столбик залит цветом своей точки и стоит ровно под ней. Высоты явно разные: у сиреневой низкий, у синей самый высокий, у зелёной средний. Справа те же три высоты стоят в другом порядке — ровно так, как сигма переставила цвета: значения поехали за именами, сами значения не изменились. Между пространствами стрелка эф сигма идёт в ту же сторону, что и сигма. Две короткие пунктирные стрелки, обе подписанные эр в степени прочерк, ведут от каждого множества вниз к его пространству функций и замыкают квадрат из четырёх стрелок">
