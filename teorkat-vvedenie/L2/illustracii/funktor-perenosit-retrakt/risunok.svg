<svg viewBox="0 0 1900 394" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block" role="img" aria-label="Один и тот же чертёж, повторённый двумя ярусами. Вверху объекты A и B: тонкая стрелка s ведёт от A к B, пунктирная стрелка r возвращается от B к A, а между ними жирная дуга выходит из A, разворачивается полукругом у B и возвращается стрелкой в тот же A — она помечена как тождественная стрелка объекта A. Две пунктирные стрелки, обе подписанные F, ведут от A и от B вниз. Внизу — тот же чертёж буква в букву для образов: объекты F от A и F от B, стрелки F от s и F от r и такая же жирная дуга, возвращающаяся в F от A и помеченная тождественной стрелкой объекта F от A">
