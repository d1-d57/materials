<svg viewBox="0 0 840 208" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block" role="img" aria-label="Два яруса. Вверху множества X и Y, по четыре точки; стрелка сигма переименовывает — сиреневая и синяя точки X стоят на первых двух местах, а в Y те же сиреневая и синяя стоят на двух последних. Внизу те же множества как P2 от X и P2 от Y, по шесть безымянных точек, между ними стрелка P2 от сигма. В каждом нижнем множестве выделена ровно одна точка, и к ней сходятся две пунктирные линии от сиреневой и синей точек своего верхнего множества: эта точка и есть та пара. Две вертикальные стрелки, обе подписаны P2, ведут от верхнего яруса к нижнему и замыкают квадрат из четырёх стрелок">
