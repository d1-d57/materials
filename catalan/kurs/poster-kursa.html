  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'PT Serif';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2a9bf1c6-2e4f-45f5-898b-e9b7be23b0cc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  @page { size: A4; margin: 0; }\n  html, body { margin: 0; padding: 0; background: #d9d5cc; }\n  @media print { html, body { background: #fff; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:210mm;height:297mm;box-sizing:border-box;padding:15mm 14mm 11mm;position:relative;display:flex;flex-direction:column;background:#fff;font-family:'PT Serif',Georgia,'Times New Roman',serif;color:#1a1a1a;overflow:hidden;margin:0 auto;\">\n\n  <div style=\"position: absolute; inset: 6mm; border: 2.5pt solid #C8102E; border-radius: 3mm; pointer-events: none; z-index: 2; left: 18px; top: 23px\"><\u002Fdiv>\n\n  <div style=\"position:absolute;top:9mm;right:9mm;width:25mm;height:25mm;z-index:3;\">\n    <img src=\"38a08f2c-ac62-4850-8231-0494e799204d\" alt=\"Алые паруса\" style=\"width:100%;height:100%;object-fit:contain;\">\n  <\u002Fdiv>\n\n  <header style=\"text-align:center;padding:0 6mm;margin-bottom:7mm;margin-top:1.5mm;\">\n    <h1 style=\"font-size:26pt;line-height:1.05;font-weight:700;margin:0 0 3.5mm;letter-spacing:-0.01em;\">Пути, деревья и вероятность<\u002Fh1>\n    <div style=\"font-family:'PT Sans',Arial,sans-serif;font-size:11.5pt;color:#1a1a1a;font-weight:600;display:flex;justify-content:center;flex-wrap:nowrap;gap:0 3mm;align-items:baseline;white-space:nowrap;\">\n      <span>Ваня&nbsp;Яковлев<\u002Fspan><span style=\"color:#C8102E;font-weight:700;\">·<\u002Fspan>\n      <span><span style=\"color:#666;font-weight:400;font-size:10pt;\">когда<\u002Fspan> 3&nbsp;пара<\u002Fspan><span style=\"color:#C8102E;font-weight:700;\">·<\u002Fspan>\n      <span><span style=\"color:#666;font-weight:400;font-size:10pt;\">для кого<\u002Fspan> 8–9&nbsp;класс<\u002Fspan><span style=\"color:#C8102E;font-weight:700;\">·<\u002Fspan>\n      <span><span style=\"color:#666;font-weight:400;font-size:10pt;\">сколько<\u002Fspan> по 4 пары каждый<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"position:relative;flex:1;min-height:0;\">\n    <div style=\"display:flex;gap:7mm;align-items:flex-start;\">\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"border-top:2pt solid #C8102E;padding-top:2mm;margin-bottom:2mm;\">\n          <div style=\"font-family:'PT Sans',Arial,sans-serif;font-size:9pt;letter-spacing:0.1em;text-transform:uppercase;color:#C8102E;font-weight:700;margin-bottom:0.8mm;\">Мини-курс I<\u002Fdiv>\n          <h2 style=\"font-size:16pt;line-height:1.08;font-weight:700;margin:0 0 0.8mm;\">Вероятность в мире путей<\u002Fh2>\n          <div style=\"font-size:11pt;font-style:italic;color:#444;line-height:1.2;\">Числа Каталана, блуждания и задача о голосах<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5pt;line-height:1.36;text-align:justify;hyphens:auto;\">\n          <p style=\"margin:0 0 2.3mm;\">Числа Каталана возникают во множестве задач: они считают триангуляции многоугольника, деревья, скобочные последовательности, пути Дика и перестановки, сортируемые стеком. Мы начинаем с обсуждения этих задач и с вопроса, почему одно и то же число всплывает в таких разных контекстах.<\u002Fp>\n          <p style=\"margin:0 0 2.4mm;\">Но главные герои курса — вероятностные модели. <br>В одной из них голоса за двух кандидатов достают из урны в случайном порядке: с какой вероятностью победитель все время лидирует, ни разу не уступив? В другой частица шагает по прямой влево-вправо наугад: вернётся ли она домой и через какое время?<\u002Fp>\n          <p style=\"margin:0 0 2.4mm;\">За всеми этими задачами стоит один приём. Разные по природе объекты оказываются в точном взаимно однозначном соответствии, и трудный подсчёт на одном языке становится очевидным на другом. Видеть их — главное умение, которому учит курс.<\u002Fp>\n          <p style=\"margin:0;\">Даже тем, кто уже встречал числа Каталана, курс откроет их заново: рекуррентной формулой дело далеко не ограничивается. А еще, он откроет нам дорогу к задаче о парковке и формуле Кэли.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"border-top:2pt solid #C8102E;padding-top:2mm;margin-bottom:2mm;\">\n          <div style=\"font-family:'PT Sans',Arial,sans-serif;font-size:9pt;letter-spacing:0.1em;text-transform:uppercase;color:#C8102E;font-weight:700;margin-bottom:0.8mm;\">Мини-курс II<\u002Fdiv>\n          <h2 style=\"font-size:16pt;line-height:1.08;font-weight:700;margin:0 0 0.8mm;\">Статистика деревьев<\u002Fh2>\n          <div style=\"font-size:11pt;font-style:italic;color:#444;line-height:1.2;\">Задача о парковках и формула Кэли<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5pt;line-height:1.36;text-align:justify;hyphens:auto;\">\n          <p style=\"margin:0 0 2.3mm;\">Очередь из n машин выстроились в начале улицы с односторонним движением и n парковочными местами. Каждая едет к любимому месту; если оно занято — встаёт на первое свободное. С какой вероятностью припарковаться удастся всем?<\u002Fp>\n          <p style=\"margin:0 0 2.4mm;\">Ответ неожиданно оказывается связан с числом деревьев на n вершинах — это формула Кэли, к которой мы придем сразу несколькими путями.<\u002Fp>\n          <p style=\"margin:0 0 2.4mm;\">За подсчётами прячутся и другие вероятностные сюжеты и та же техника соответствий: парковки, деревья и пути на решётке превращаются друг в друга,&nbsp; упрощая комбинаторные доказательства.<\u002Fp>\n          <p style=\"margin:0;\">Это неформальное продолжение первого курса: парковка при ближайшем рассмотрении оказывается переодетым путём Дика, и оба курса держатся на одном круге идей. Но слушать второй можно и отдельно.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;left:0;right:0;bottom:0;height:112mm;\">\n    <svg viewBox=\"20 45 1170 675\" style=\"width:100%;height:100%;\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMax meet\">\n        <line x1=\"40\" y1=\"680\" x2=\"620\" y2=\"680\" stroke=\"#b9b1a1\" stroke-width=\"2\"><\u002Fline>\n        <polyline points=\"40,680 81,595 123,510 164,425 206,510 247,425 289,340 330,425 371,510 413,595 454,680 496,595 537,510 578,595 620,680\" fill=\"none\" stroke=\"#3a332a\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n        <circle cx=\"61\" cy=\"638\" r=\"21\" fill=\"#4f8f4a\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"102\" cy=\"553\" r=\"21\" fill=\"#c0566f\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"144\" cy=\"468\" r=\"21\" fill=\"#c79a2e\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"226\" cy=\"468\" r=\"21\" fill=\"#c9743a\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"268\" cy=\"383\" r=\"21\" fill=\"#8a5aa8\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"475\" cy=\"638\" r=\"21\" fill=\"#2f6e8e\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <circle cx=\"516\" cy=\"553\" r=\"21\" fill=\"#3f9fa0\" stroke=\"#fff\" stroke-width=\"3.4\"><\u002Fcircle>\n        <line x1=\"636\" y1=\"540\" x2=\"744\" y2=\"540\" stroke=\"#8a8375\" stroke-width=\"3\"><\u002Fline>\n        <path d=\"M636,540 l16,-8 l0,16 Z\" fill=\"#8a8375\"><\u002Fpath>\n        <path d=\"M744,540 l-16,-8 l0,16 Z\" fill=\"#8a8375\"><\u002Fpath>\n        <line x1=\"960\" y1=\"85\" x2 v>\n    <p style=\"font-size: 15px; line-height: 1.5; text-align: left; color: #1a1a1a; margin: 0; width: 580px; height: 50px\">знакомство с числами сочетаний, понятием биекции и азами теории графов<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
