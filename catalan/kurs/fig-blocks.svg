<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" font-size="16"><rect width="1040" height="530" fill="#fbfaf7"/><text x="40" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2b2b33">Шаг 2: разрезаем кольцо в начале отмеченного ↑-блока</text><text x="40" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">Получается чередование блоков — это ровно пара композиций: (aᵢ) для ↑ и (bᵢ) для ↓.</text><circle cx="210" cy="255" r="100" fill="none" stroke="#c9c6bd" stroke-width="1.6"/><circle cx="210.0" cy="155.0" r="18" fill="#3a6ea5"/><text x="210.0" y="161.0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↑</text><circle cx="288.2" cy="192.7" r="18" fill="#3a6ea5"/><text x="288.2" y="198.7" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↑</text><circle cx="307.5" cy="277.3" r="18" fill="#3a6ea5"/><text x="307.5" y="283.3" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↑</text><circle cx="253.4" cy="345.1" r="18" fill="#b05a3c"/><text x="253.4" y="351.1" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↓</text><circle cx="166.6" cy="345.1" r="18" fill="#b05a3c"/><text x="166.6" y="351.1" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↓</text><circle cx="112.5" cy="277.3" r="18" fill="#3a6ea5"/><text x="112.5" y="283.3" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↑</text><circle cx="131.8" cy="192.7" r="18" fill="#b05a3c"/><text x="131.8" y="198.7" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff">↓</text><text x="154" y="147" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#c8a24a">✂</text><text x="210" y="397" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2b2b33">режем в начале ↑-блока</text><text x="430" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2b2b33">→</text><rect x="500" y="218" width="38" height="44" rx="8" fill="#3a6ea5"/><text x="519" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><rect x="544" y="218" width="38" height="44" rx="8" fill="#3a6ea5"/><text x="563" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><rect x="588" y="218" width="38" height="44" rx="8" fill="#3a6ea5"/><text x="607" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><rect x="632" y="218" width="38" height="44" rx="8" fill="#b05a3c"/><text x="651" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><rect x="676" y="218" width="38" height="44" rx="8" fill="#b05a3c"/><text x="695" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><rect x="720" y="218" width="38" height="44" rx="8" fill="#3a6ea5"/><text x="739" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><rect x="764" y="218" width="38" height="44" rx="8" fill="#b05a3c"/><text x="783" y="247" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><line x1="500" y1="272" x2="626" y2="272" stroke="#3a6ea5" stroke-width="2.4"/><text x="563" y="292" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3a6ea5">a₁ = 3</text><line x1="632" y1="316" x2="714" y2="316" stroke="#b05a3c" stroke-width="2.4"/><text x="673" y="336" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b05a3c">b₁ = 2</text><line x1="720" y1="272" x2="758" y2="272" stroke="#3a6ea5" stroke-width="2.4"/><text x="739" y="292" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3a6ea5">a₂ = 1</text><line x1="764" y1="316" x2="802" y2="316" stroke="#b05a3c" stroke-width="2.4"/><text x="783" y="336" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b05a3c">b₂ = 1</text><text x="40" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">Σaᵢ = r = n+1 (вверх), Σbᵢ = m−r = n (вниз), блоков по j штук ⇒ композиций C(r−1, j−1) и C(m−r−1, j−1).</text><text x="40" y="504" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b2b33">Место разреза — m способов, но каждая конфигурация посчитана j раз (по одному на ↑-блок) ⇒ делим на j.</text></svg>