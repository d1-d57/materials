<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 772" font-size="16"><rect width="1040" height="772" fill="#fbfaf7"/><text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2b2b33">Цикл-лемма (лемма Рени): <tspan font-style="italic">ровно один</tspan> хороший поворот из 2n+1</text><text x="40" y="76" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8a8a95">Пример n=3: 4 шага ↑(+1) и 3 шага ↓(−1), сумма = +1. Замыкаем в кольцо и читаем с разных мест.</text><circle cx="175" cy="250" r="105" fill="none" stroke="#c9c6bd" stroke-width="1.5"/><circle cx="175.0" cy="145.0" r="18" fill="#3a6ea5"/><text x="175.0" y="151.0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↑</text><circle cx="257.1" cy="184.5" r="18" fill="#b05a3c"/><text x="257.1" y="190.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↓</text><circle cx="277.4" cy="273.4" r="18" fill="#3a6ea5"/><text x="277.4" y="279.4" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↑</text><circle cx="220.6" cy="344.6" r="18" fill="#3a6ea5"/><text x="220.6" y="350.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↑</text><circle cx="129.4" cy="344.6" r="18" fill="#b05a3c"/><text x="129.4" y="350.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↓</text><circle cx="72.6" cy="273.4" r="18" fill="#3a6ea5"/><text x="72.6" y="279.4" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↑</text><circle cx="92.9" cy="184.5" r="18" fill="#b05a3c"/><text x="92.9" y="190.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fff">↓</text><text x="175" y="255" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a95">7 поворотов</text><text x="175" y="395" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2b2b33">кольцо из шагов</text><text x="370" y="116" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2b2b33">Все 7 поворотов:</text><line x1="418" y1="178" x2="509" y2="178" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 178.0 L 431.0 167.0 L 444.0 178.0 L 457.0 167.0 L 470.0 156.0 L 483.0 167.0 L 496.0 156.0 L 509.0 167.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="178.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="167.0" r="2.3" fill="#2b2b33"/><circle cx="444.0" cy="178.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="167.0" r="2.3" fill="#2b2b33"/><circle cx="470.0" cy="156.0" r="2.3" fill="#2b2b33"/><circle cx="483.0" cy="167.0" r="2.3" fill="#2b2b33"/><circle cx="496.0" cy="156.0" r="2.3" fill="#2b2b33"/><circle cx="509.0" cy="167.0" r="2.3" fill="#2b2b33"/><text x="392" y="184" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><line x1="418" y1="258" x2="509" y2="258" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 258.0 L 431.0 269.0 L 444.0 258.0 L 457.0 247.0 L 470.0 258.0 L 483.0 247.0 L 496.0 258.0 L 509.0 247.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="258.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="269.0" r="3.4" fill="#c0392b"/><circle cx="444.0" cy="258.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="247.0" r="2.3" fill="#2b2b33"/><circle cx="470.0" cy="258.0" r="3.4" fill="#c0392b"/><circle cx="483.0" cy="247.0" r="2.3" fill="#2b2b33"/><circle cx="496.0" cy="258.0" r="3.4" fill="#c0392b"/><circle cx="509.0" cy="247.0" r="2.3" fill="#2b2b33"/><text x="392" y="264" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><line x1="418" y1="338" x2="509" y2="338" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 338.0 L 431.0 327.0 L 444.0 316.0 L 457.0 327.0 L 470.0 316.0 L 483.0 327.0 L 496.0 316.0 L 509.0 327.0" fill="none" stroke="#2e7d4f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="338.0" r="2.3" fill="#2e7d4f"/><circle cx="431.0" cy="327.0" r="2.3" fill="#2e7d4f"/><circle cx="444.0" cy="316.0" r="2.3" fill="#2e7d4f"/><circle cx="457.0" cy="327.0" r="2.3" fill="#2e7d4f"/><circle cx="470.0" cy="316.0" r="2.3" fill="#2e7d4f"/><circle cx="483.0" cy="327.0" r="2.3" fill="#2e7d4f"/><circle cx="496.0" cy="316.0" r="2.3" fill="#2e7d4f"/><circle cx="509.0" cy="327.0" r="2.3" fill="#2e7d4f"/><text x="392" y="344" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#2e7d4f">✓</text><rect x="406" y="312" width="121" height="48" rx="7" fill="none" stroke="#2e7d4f" stroke-width="2"/><text x="543" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2e7d4f">все частичные суммы &gt; 0 → доминирующий</text><line x1="418" y1="418" x2="509" y2="418" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 418.0 L 431.0 407.0 L 444.0 418.0 L 457.0 407.0 L 470.0 418.0 L 483.0 407.0 L 496.0 418.0 L 509.0 407.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="418.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="407.0" r="2.3" fill="#2b2b33"/><circle cx="444.0" cy="418.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="407.0" r="2.3" fill="#2b2b33"/><circle cx="470.0" cy="418.0" r="3.4" fill="#c0392b"/><circle cx="483.0" cy="407.0" r="2.3" fill="#2b2b33"/><circle cx="496.0" cy="418.0" r="3.4" fill="#c0392b"/><circle cx="509.0" cy="407.0" r="2.3" fill="#2b2b33"/><text x="392" y="424" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><line x1="418" y1="498" x2="509" y2="498" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 498.0 L 431.0 509.0 L 444.0 498.0 L 457.0 509.0 L 470.0 498.0 L 483.0 509.0 L 496.0 498.0 L 509.0 487.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="498.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="509.0" r="3.4" fill="#c0392b"/><circle cx="444.0" cy="498.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="509.0" r="3.4" fill="#c0392b"/><circle cx="470.0" cy="498.0" r="3.4" fill="#c0392b"/><circle cx="483.0" cy="509.0" r="3.4" fill="#c0392b"/><circle cx="496.0" cy="498.0" r="3.4" fill="#c0392b"/><circle cx="509.0" cy="487.0" r="2.3" fill="#2b2b33"/><text x="392" y="504" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><line x1="418" y1="578" x2="509" y2="578" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 578.0 L 431.0 567.0 L 444.0 578.0 L 457.0 567.0 L 470.0 578.0 L 483.0 567.0 L 496.0 556.0 L 509.0 567.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="578.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="567.0" r="2.3" fill="#2b2b33"/><circle cx="444.0" cy="578.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="567.0" r="2.3" fill="#2b2b33"/><circle cx="470.0" cy="578.0" r="3.4" fill="#c0392b"/><circle cx="483.0" cy="567.0" r="2.3" fill="#2b2b33"/><circle cx="496.0" cy="556.0" r="2.3" fill="#2b2b33"/><circle cx="509.0" cy="567.0" r="2.3" fill="#2b2b33"/><text x="392" y="584" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><line x1="418" y1="658" x2="509" y2="658" stroke="#c9c6bd" stroke-width="1"/><path d="M 418.0 658.0 L 431.0 669.0 L 444.0 658.0 L 457.0 669.0 L 470.0 658.0 L 483.0 647.0 L 496.0 658.0 L 509.0 647.0" fill="none" stroke="#2b2b33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.0" cy="658.0" r="3.4" fill="#c0392b"/><circle cx="431.0" cy="669.0" r="3.4" fill="#c0392b"/><circle cx="444.0" cy="658.0" r="3.4" fill="#c0392b"/><circle cx="457.0" cy="669.0" r="3.4" fill="#c0392b"/><circle cx="470.0" cy="658.0" r="3.4" fill="#c0392b"/><circle cx="483.0" cy="647.0" r="2.3" fill="#2b2b33"/><circle cx="496.0" cy="658.0" r="3.4" fill="#c0392b"/><circle cx="509.0" cy="647.0" r="2.3" fill="#2b2b33"/><text x="392" y="664" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c0392b">✗</text><text x="543" y="190" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c0392b">где-то сумма падает до 0 или ниже (красная точка)</text><line x1="40" y1="678" x2="1000" y2="678" stroke="#c9c6bd" stroke-width="1"/><text x="40" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2b2b33">У доминирующего (<tspan font-family="'Helvetica Neue', Arial, sans-serif" fill="#2e7d4f">✓</tspan>) первый шаг всегда ↑ — сотри его, останется <tspan font-style="italic">путь Дика</tspan> длины 2n=6.</text><text x="40" y="734" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2b2b33">На каждый путь Дика — ровно 2n+1=7 последовательностей ⇒ <tspan font-weight="bold">Cₙ = C(2n,n)/(n+1)</tspan> (здесь C₃ = 35/7 = 5).</text></svg>