<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-size="16"><rect width="980" height="460" fill="#fbfaf7"/><text x="40" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2b2b33">Ветвящийся процесс → блуждание (обход в глубину)</text><text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">Каждый заражает 0 или 2 (монетка). Дерево из N вершин ⟺ блуждание впервые попадает в −1 на шаге N.</text><line x1="218" y1="150" x2="154" y2="220" stroke="#c9c6bd" stroke-width="2"/><line x1="218" y1="150" x2="282" y2="220" stroke="#c9c6bd" stroke-width="2"/><line x1="282" y1="220" x2="250" y2="290" stroke="#c9c6bd" stroke-width="2"/><line x1="282" y1="220" x2="327" y2="290" stroke="#c9c6bd" stroke-width="2"/><circle cx="218" cy="150" r="17" fill="#3a6ea5"/><text x="218" y="155" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">+1</text><circle cx="154" cy="220" r="17" fill="#b05a3c"/><text x="154" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">−1</text><circle cx="282" cy="220" r="17" fill="#3a6ea5"/><text x="282" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">+1</text><circle cx="250" cy="290" r="17" fill="#b05a3c"/><text x="250" y="295" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">−1</text><circle cx="327" cy="290" r="17" fill="#b05a3c"/><text x="327" y="295" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff">−1</text><text x="218" y="404" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8a8a95">внутр. вершина: +1 · лист: −1 (обход слева-направо)</text><line x1="560" y1="205" x2="830" y2="205" stroke="#9a9488" stroke-width="1.3"/><line x1="560" y1="251" x2="830" y2="251" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="550" y="210" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a8a95">0</text><text x="550" y="256" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c0392b">−1</text><polyline points="560,205 614,159 668,205 722,159 776,205 830,251" fill="none" stroke="#2b2b33" stroke-width="2.6"/><circle cx="560" cy="205" r="3" fill="#2b2b33"/><circle cx="614" cy="159" r="3" fill="#2b2b33"/><circle cx="668" cy="205" r="3" fill="#2b2b33"/><circle cx="722" cy="159" r="3" fill="#2b2b33"/><circle cx="776" cy="205" r="3" fill="#2b2b33"/><circle cx="830" cy="251" r="3" fill="#2b2b33"/><circle cx="830" cy="251" r="6" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="840" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c0392b">первое −1: шаг N=5</text><text x="490.0" y="444" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b2b33">Цикл-лемма ⇒ P(T=N) = (1/N)·P(S_N=−1); для 0/2 это Cₘ / 2^(2m+1), N=2m+1.</text></svg>