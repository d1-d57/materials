<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 648" font-size="16"><rect width="1120" height="648" fill="#fbfaf7"/><text x="40" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2b2b33">Нараяна через непересекающиеся пути: как они строятся</text><text x="40" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">Пример n=5, k=3 пика: путь UUDUDUUDDD. Пробеги a=(2,1,2), b=(1,1,3) ⇒ A=(2,3), B=(1,2).</text><line x1="62" y1="330" x2="398" y2="330" stroke="#9a9488" stroke-width="1.3"/><line x1="70" y1="330" x2="102" y2="298" stroke="#3a6ea5" stroke-width="3.4" stroke-linecap="round"/><line x1="102" y1="298" x2="134" y2="266" stroke="#3a6ea5" stroke-width="3.4" stroke-linecap="round"/><line x1="134" y1="266" x2="166" y2="298" stroke="#b05a3c" stroke-width="3.4" stroke-linecap="round"/><line x1="166" y1="298" x2="198" y2="266" stroke="#3a6ea5" stroke-width="3.4" stroke-linecap="round"/><line x1="198" y1="266" x2="230" y2="298" stroke="#b05a3c" stroke-width="3.4" stroke-linecap="round"/><line x1="230" y1="298" x2="262" y2="266" stroke="#3a6ea5" stroke-width="3.4" stroke-linecap="round"/><line x1="262" y1="266" x2="294" y2="234" stroke="#3a6ea5" stroke-width="3.4" stroke-linecap="round"/><line x1="294" y1="234" x2="326" y2="266" stroke="#b05a3c" stroke-width="3.4" stroke-linecap="round"/><line x1="326" y1="266" x2="358" y2="298" stroke="#b05a3c" stroke-width="3.4" stroke-linecap="round"/><line x1="358" y1="298" x2="390" y2="330" stroke="#b05a3c" stroke-width="3.4" stroke-linecap="round"/><circle cx="70" cy="330" r="2.8" fill="#2b2b33"/><circle cx="102" cy="298" r="2.8" fill="#2b2b33"/><circle cx="134" cy="266" r="2.8" fill="#2b2b33"/><circle cx="166" cy="298" r="2.8" fill="#2b2b33"/><circle cx="198" cy="266" r="2.8" fill="#2b2b33"/><circle cx="230" cy="298" r="2.8" fill="#2b2b33"/><circle cx="262" cy="266" r="2.8" fill="#2b2b33"/><circle cx="294" cy="234" r="2.8" fill="#2b2b33"/><circle cx="326" cy="266" r="2.8" fill="#2b2b33"/><circle cx="358" cy="298" r="2.8" fill="#2b2b33"/><circle cx="390" cy="330" r="2.8" fill="#2b2b33"/><line x1="70" y1="360" x2="134" y2="360" stroke="#3a6ea5" stroke-width="2.4"/><text x="102" y="378" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">a₁=2</text><line x1="134" y1="390" x2="166" y2="390" stroke="#b05a3c" stroke-width="2.4"/><text x="150" y="408" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b05a3c">b₁=1</text><line x1="166" y1="360" x2="198" y2="360" stroke="#3a6ea5" stroke-width="2.4"/><text x="182" y="378" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">a₂=1</text><line x1="198" y1="390" x2="230" y2="390" stroke="#b05a3c" stroke-width="2.4"/><text x="214" y="408" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b05a3c">b₂=1</text><line x1="230" y1="360" x2="294" y2="360" stroke="#3a6ea5" stroke-width="2.4"/><text x="262" y="378" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">a₃=2</text><line x1="294" y1="390" x2="390" y2="390" stroke="#b05a3c" stroke-width="2.4"/><text x="342" y="408" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b05a3c">b₃=3</text><text x="70" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">Aᵢ = суммы подъёмных: A = (2, 3)</text><text x="70" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">Bᵢ = суммы спусковых: B = (1, 2)</text><text x="70" y="508" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c8a24a">условие Дика ⟺ Aᵢ ≥ Bᵢ: 2≥1, 3≥2 ✓</text><line x1="728" y1="500" x2="728" y2="314" stroke="#c9c6bd" stroke-width="0.9"/><line x1="790" y1="500" x2="790" y2="314" stroke="#c9c6bd" stroke-width="0.9"/><line x1="852" y1="500" x2="852" y2="314" stroke="#c9c6bd" stroke-width="0.9"/><line x1="914" y1="500" x2="914" y2="314" stroke="#c9c6bd" stroke-width="0.9"/><line x1="728" y1="500" x2="914" y2="500" stroke="#c9c6bd" stroke-width="0.9"/><line x1="728" y1="438" x2="914" y2="438" stroke="#c9c6bd" stroke-width="0.9"/><line x1="728" y1="376" x2="914" y2="376" stroke="#c9c6bd" stroke-width="0.9"/><line x1="728" y1="314" x2="914" y2="314" stroke="#c9c6bd" stroke-width="0.9"/><polyline points="728,438 728,376 728,314 790,314 852,314" fill="none" stroke="#b05a3c" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="790,500 852,500 852,438 852,376 914,376" fill="none" stroke="#3a6ea5" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="790" cy="500" r="4" fill="#3a6ea5"/><circle cx="852" cy="500" r="4" fill="#3a6ea5"/><circle cx="852" cy="438" r="4" fill="#3a6ea5"/><circle cx="852" cy="376" r="4" fill="#3a6ea5"/><circle cx="914" cy="376" r="4" fill="#3a6ea5"/><circle cx="728" cy="438" r="4" fill="#b05a3c"/><circle cx="728" cy="376" r="4" fill="#b05a3c"/><circle cx="728" cy="314" r="4" fill="#b05a3c"/><circle cx="790" cy="314" r="4" fill="#b05a3c"/><circle cx="852" cy="314" r="4" fill="#b05a3c"/><text x="784" y="522" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">старт A (0,0)</text><text x="924" y="381" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">конец A (n−k, k−1)</text><text x="720" y="443" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b05a3c">старт B (−1, 1)</text><text x="862" y="319" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b05a3c">конец B (n−k−1, k)</text><text x="690" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#2b2b33">A: ↑-шаги на {2,3} · B: ↑-шаги на {1,2}, сдвинут на (−1,+1)</text><text x="40" y="596" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">Сдвиг B на (−1,+1) превращает нестрогое Aᵢ ≥ Bᵢ в «пути не имеют общих вершин» — только тогда работает LGV.</text><text x="40" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b2b33">N(n,k) = C(n−1,k−1)² − C(n−1,k)·C(n−1,k−2)  — определитель из четырёх счётов путей между этими концами.</text></svg>