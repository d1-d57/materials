<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" font-size="16"><rect width="1060" height="430" fill="#fbfaf7"/><text x="40" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2b2b33">Биекция Чжуна–Феллера: разрез в точке возврата на ось</text><text x="40" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">Первый подъём с оси → идём до первого возврата на ось (ребро X). Путь [A] X [B] → переставляем в [B] X [A].</text><line x1="76" y1="230" x2="368" y2="230" stroke="#9a9488" stroke-width="1.4"/><line x1="90" y1="230" x2="134" y2="190" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><line x1="134" y1="190" x2="178" y2="150" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><line x1="178" y1="150" x2="222" y2="190" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><line x1="222" y1="190" x2="266" y2="230" stroke="#c8a24a" stroke-width="5" stroke-linecap="round"/><line x1="266" y1="230" x2="310" y2="190" stroke="#2e7d4f" stroke-width="5" stroke-linecap="round"/><line x1="310" y1="190" x2="354" y2="230" stroke="#2e7d4f" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="230" r="3.2" fill="#2b2b33"/><circle cx="134" cy="190" r="3.2" fill="#2b2b33"/><circle cx="178" cy="150" r="3.2" fill="#2b2b33"/><circle cx="222" cy="190" r="3.2" fill="#2b2b33"/><circle cx="266" cy="230" r="3.2" fill="#2b2b33"/><circle cx="310" cy="190" r="3.2" fill="#2b2b33"/><circle cx="354" cy="230" r="3.2" fill="#2b2b33"/><text x="222.0" y="302" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">[A] X [B] — 6 шагов над осью</text><text x="156.0" y="134" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3a6ea5">A</text><text x="244.0" y="256" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c8a24a">X (возврат)</text><text x="310" y="174" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2e7d4f">B</text><text x="560" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2b2b33">→</text><line x1="626" y1="230" x2="918" y2="230" stroke="#9a9488" stroke-width="1.4"/><line x1="640" y1="230" x2="684" y2="190" stroke="#2e7d4f" stroke-width="5" stroke-linecap="round"/><line x1="684" y1="190" x2="728" y2="230" stroke="#2e7d4f" stroke-width="5" stroke-linecap="round"/><line x1="728" y1="230" x2="772" y2="270" stroke="#c8a24a" stroke-width="5" stroke-linecap="round"/><line x1="772" y1="270" x2="816" y2="230" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><line x1="816" y1="230" x2="860" y2="190" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><line x1="860" y1="190" x2="904" y2="230" stroke="#3a6ea5" stroke-width="5" stroke-linecap="round"/><circle cx="640" cy="230" r="3.2" fill="#2b2b33"/><circle cx="684" cy="190" r="3.2" fill="#2b2b33"/><circle cx="728" cy="230" r="3.2" fill="#2b2b33"/><circle cx="772" cy="270" r="3.2" fill="#2b2b33"/><circle cx="816" cy="230" r="3.2" fill="#2b2b33"/><circle cx="860" cy="190" r="3.2" fill="#2b2b33"/><circle cx="904" cy="230" r="3.2" fill="#2b2b33"/><text x="772.0" y="302" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b33">[B] X [A] — 4 шага над осью</text><text x="530.0" y="412" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b2b33">Обратимо ⇒ классы «2k шагов над осью» связаны цепочкой и равны: каждый ровно Cₙ.</text></svg>