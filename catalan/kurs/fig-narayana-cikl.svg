<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" font-size="16"><rect width="1020" height="520" fill="#fbfaf7"/><text x="40" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#2b2b33">Нараяна через цикл-лемму: пик = стык ↑→↓ на кольце</text><text x="40" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">Крутим не пары пробегов, а сами 2n+1 букв. Число стыков ↑→↓ поворот не меняет.</text><circle cx="250" cy="265" r="115" fill="none" stroke="#c9c6bd" stroke-width="1.6"/><circle cx="250.0" cy="150.0" r="20" fill="#3a6ea5"/><text x="250.0" y="156.0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><circle cx="339.9" cy="193.3" r="20" fill="#3a6ea5"/><text x="339.9" y="199.3" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><circle cx="362.1" cy="290.6" r="20" fill="#3a6ea5"/><text x="362.1" y="296.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><circle cx="299.9" cy="368.6" r="20" fill="#b05a3c"/><text x="299.9" y="374.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><circle cx="200.1" cy="368.6" r="20" fill="#b05a3c"/><text x="200.1" y="374.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><circle cx="137.9" cy="290.6" r="20" fill="#3a6ea5"/><text x="137.9" y="296.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↑</text><circle cx="160.1" cy="193.3" r="20" fill="#b05a3c"/><text x="160.1" y="199.3" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff">↓</text><circle cx="364.9" cy="356.7" r="11" fill="none" stroke="#c8a24a" stroke-width="3"/><circle cx="106.7" cy="232.3" r="11" fill="none" stroke="#c8a24a" stroke-width="3"/><text x="250" y="271" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8a8a95">2 стыка ↑→↓</text><text x="250" y="442" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2b2b33">кольцо: 4↑ и 3↓ (2n+1=7)</text><text x="500" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2b2b33">→</text><line x1="570" y1="320" x2="938" y2="320" stroke="#9a9488" stroke-width="1.4"/><line x1="580" y1="320" x2="638" y2="270" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><line x1="638" y1="270" x2="696" y2="220" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><line x1="696" y1="220" x2="754" y2="270" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><line x1="754" y1="270" x2="812" y2="320" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><line x1="812" y1="320" x2="870" y2="270" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><line x1="870" y1="270" x2="928" y2="320" stroke="#2b2b33" stroke-width="3.4" stroke-linecap="round"/><circle cx="580" cy="320" r="3" fill="#2b2b33"/><circle cx="638" cy="270" r="3" fill="#2b2b33"/><circle cx="696" cy="220" r="3" fill="#2b2b33"/><circle cx="754" cy="270" r="3" fill="#2b2b33"/><circle cx="812" cy="320" r="3" fill="#2b2b33"/><circle cx="870" cy="270" r="3" fill="#2b2b33"/><circle cx="928" cy="320" r="3" fill="#2b2b33"/><circle cx="696" cy="220" r="10" fill="none" stroke="#c8a24a" stroke-width="3"/><circle cx="870" cy="270" r="10" fill="none" stroke="#c8a24a" stroke-width="3"/><text x="754.0" y="366" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2b2b33">снимаем ведущий ↑ → путь Дика, 2 пика</text><text x="510.0" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b2b33">j стыков на кольце ⟺ j пиков пути ⟹ N(n,k) = (1/k)·C(n,k−1)·C(n−1,k−1).</text></svg>