# Список материалов на титульной странице.
#
# ЭТО ЕДИНСТВЕННЫЙ ФАЙЛ, КОТОРЫЙ НУЖНО ПРАВИТЬ, ЧТОБЫ ВЫЛОЖИТЬ НОВОЕ.
# Положил файлы материала в static/<папка>/ — допиши сюда три строки, и он
# появится на титульной. Ничего в html править не надо.
#
#   - nazvanie: Как называется
#     opisanie: Одна строка, о чём это
#     ssylka: papka/            ← адрес внутри сайта; для отдельного файла — papka/file.html
#
# Порядок в списке = порядок на странице. Когда материалов станет много и
# захочется разделов, у записей заведётся ещё одно поле (например `razdel:`),
# а шаблон научится группировать — переписывать список не придётся.

